name: Testes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regras:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - name: Verificar fonte executável única
        run: npm run build
      - name: Regressão dos motores incorporados
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regras-${{ matrix.shard }}
          path: testes/saida/
          retention-days: 7
  plataforma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:reprodutibilidade
      - run: npm run test:plataforma
      - name: Verificação não reescreve o aplicativo
        run: git diff --exit-code -- Plataforma.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plataforma-e-evidencias
          path: |
            Plataforma.html
            testes/saida/
          retention-days: 7
