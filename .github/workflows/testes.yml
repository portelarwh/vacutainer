# Testes automáticos (13/11/2026, pendência "package.json/CI" do registro § 1, decidida pelo responsável).
# 1) as páginas de paginas/ batem com as fontes (rodar os builds não muda nada);
# 2) a suíte inteira (node testes/tudo.js): passou / falhou / NÃO VERIFICADO (falta biblioteca ou pacote; não conta como aprovado),
#    dividida em 4 partes que rodam ao mesmo tempo (node testes/tudo.js --parte=N/4; as partes são montadas pelo tempo de cada teste).
name: Testes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  paginas:
    name: páginas iguais às fontes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: npm install --no-audit --no-fund
      - name: Páginas geradas iguais às fontes
        run: |
          git show HEAD:paginas/Demonstracao.html > "$RUNNER_TEMP/Demonstracao.html"
          npm run build
          git status --porcelain paginas/
          # a demonstração embute as páginas em gzip, e os bytes do gzip mudam com a versão do zlib: ela é conferida pelo conteúdo
          git diff --exit-code --stat -- paginas/ ':(exclude)paginas/Demonstracao.html' || (echo "::error::paginas/ não bate com fontes/: rode os builds (npm run build) e grave as páginas geradas" && exit 1)
          python3 fontes/demo/conferir_demo.py "$RUNNER_TEMP/Demonstracao.html"
  testes:
    name: testes (parte ${{ matrix.parte }} de 4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências (Playwright com Chromium; pdfinfo/pdftotext para os relatórios)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Suíte de testes (parte ${{ matrix.parte }} de 4)
        run: node testes/tudo.js --parte=${{ matrix.parte }}/4
      - name: Saída dos testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saida-testes-parte-${{ matrix.parte }}
          path: testes/saida/
          retention-days: 7
