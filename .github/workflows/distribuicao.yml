name: Distribuicao Vacutainer
on:
  pull_request:
    paths:
      - '.github/workflows/distribuicao.yml'
      - 'scripts/distribuicao.cjs'
      - 'scripts/empacotar-release.py'
      - 'docs/licencas/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribuicao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pacote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Exigir main e regressao aprovada no mesmo commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/testes.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0].conclusion' | grep -x success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:reprodutibilidade
      - name: Validar o HTML isolado por file://, sem HTTP, e obter a versao
        run: |
          node scripts/distribuicao.cjs "$RUNNER_TEMP/versao.txt"
          git diff --exit-code -- Plataforma.html
      - name: Empacotar somente arquivos permitidos
        run: |
          python3 scripts/empacotar-release.py "$(cat "$RUNNER_TEMP/versao.txt")" "$GITHUB_SHA" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: vacutainer-distribuicao
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: pacote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vacutainer-distribuicao
          path: release
      - name: Criar release em rascunho (nunca publicar automaticamente)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          version="$(cat versao.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag="v$version"
          # Não reutilizar uma versão existente, nem sobrescrever assets.
          refs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            echo "Tag existente; use uma nova versão do aplicativo." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release existente; confira o rascunho antes de continuar." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Vacutainer $version" --notes-file CHANGELOG.md \
            Plataforma.html "Vacutainer-$tag-Completo.zip" "Vacutainer-$tag-Atualizacao.zip" \
            CHANGELOG.md SHA256SUMS.txt licencas.zip
