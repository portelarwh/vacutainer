<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal · Linha Vacutainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Visual comum dos sistemas da linha Vacutainer (mesmos tokens do OEE e do Gel) */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ee; --surface-3:#f6f8fa; --ink:#15222f; --muted:#5b6979; --line:#d3dae2;
  --accent:#1d4b73; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --ok:#1d8048; --warn:#a86a00; --crit:#c22a2a; --info:#2360a8; --rule:#6a3d9e; --pend:#c4570c; --none:#768290;
  --ok-bg:#e6f3eb; --warn-bg:#fbf1dc; --crit-bg:#fbe9e9; --info-bg:#e6eef8; --rule-bg:#f0eaf7; --pend-bg:#fcede2; --none-bg:#eef0f2;
  --grid:#e1e6ec; --axis:#c3cbd4; --crit-strong:#8f1515;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  /* nomes usados por esta página */
  --card:var(--surface); --pri:var(--accent); --pri2:var(--accent-soft);
  --bad:var(--crit); --badbg:var(--crit-bg); --good:var(--ok); --goodbg:var(--ok-bg); --warnbg:var(--warn-bg); --test:var(--rule);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#16202a; --surface-2:#1e2a36; --surface-3:#1a2530; --ink:#e4ebf2; --muted:#94a2b1; --line:#2a3745;
  --accent:#86b6e6; --accent-ink:#0e141a; --accent-soft:#1d2e40;
  --ok:#4dc282; --warn:#f0b54c; --crit:#ff7070; --info:#6ea7ee; --rule:#b88ee9; --pend:#f39a5a; --none:#8d99a6;
  --ok-bg:#16301f; --warn-bg:#352a12; --crit-bg:#3a1c1c; --info-bg:#172a40; --rule-bg:#2a2038; --pend-bg:#3a2414; --none-bg:#222c36;
  --grid:#243240; --axis:#3a4a5a; --crit-strong:#b02a2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --surface-2:#1e2a36; --surface-3:#1a2530; --ink:#e4ebf2; --muted:#94a2b1; --line:#2a3745;
  --accent:#86b6e6; --accent-ink:#0e141a; --accent-soft:#1d2e40;
  --ok:#4dc282; --warn:#f0b54c; --crit:#ff7070; --info:#6ea7ee; --rule:#b88ee9; --pend:#f39a5a; --none:#8d99a6;
  --ok-bg:#16301f; --warn-bg:#352a12; --crit-bg:#3a1c1c; --info-bg:#172a40; --rule-bg:#2a2038; --pend-bg:#3a2414; --none-bg:#222c36;
  --grid:#243240; --axis:#3a4a5a; --crit-strong:#b02a2a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto}
td.n,th.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3{font-family:var(--f-display);letter-spacing:.03em;margin:0}
h2{font-size:21px;font-weight:700;text-transform:uppercase}

/* faixa do modo de teste */
.testband{background:var(--rule-bg);color:var(--rule);border-bottom:1px solid color-mix(in srgb,var(--rule) 40%,var(--line));text-align:center;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px;display:none}
body.teste .testband{display:block}

/* barra superior (igual ao OEE) */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#brandLogo{height:34px;width:auto;max-width:180px;object-fit:contain;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;white-space:nowrap}
.brand .rule{font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand .ver{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px;flex:1 1 320px;min-width:0;align-items:center}
#stBase{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;margin:0}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-bg)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line));background:var(--crit-bg)}
.pill.rule{color:var(--rule);border-color:color-mix(in srgb,var(--rule) 45%,var(--line));background:var(--rule-bg)}
.sys{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sys a,.sys span{padding:4px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.sys a:last-child,.sys span:last-child{border-right:0}
.sys a:hover{background:var(--surface-2);color:var(--ink)}
.sys .cur{background:var(--accent);color:var(--accent-ink)}

/* navegação (abas) */
nav{background:var(--surface);border-bottom:1px solid var(--line)}
nav .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav .badge{font-family:var(--f-body);font-size:11px;background:var(--pend);color:#fff;border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:2px;letter-spacing:0}
main{padding-block:16px 60px}
.tab{display:none}.tab.on{display:block}

/* cartões */
.minichart{margin-top:8px}.minichart .mtit{font-size:12px;color:var(--muted);margin-bottom:2px}.minichart svg{display:block;overflow:visible}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);box-shadow:0 0 0 .5px var(--line);padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1}
.bad{color:var(--bad)}.good{color:var(--good)}.warn{color:var(--warn)}.muted{color:var(--muted)}

/* botões e campos (classes do OEE: .btn; desta página: .b) */
button.b,label.b,a.b{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;line-height:1.3;color:var(--ink)}
button.b:hover,label.b:hover,a.b:hover{background:var(--surface-2)}
button.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.p:hover{filter:brightness(1.08);background:var(--accent)}
button.d{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
button.sm,a.b.sm{padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;min-width:0;max-width:100%;color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent)}
textarea{width:100%;font-family:var(--f-mono);font-size:12px}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-bottom:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card .filters{padding:0;border:0;background:none}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.chip:after{content:" ×"}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:5px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* tabelas */
.tw{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-3);position:sticky;top:0;z-index:1;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-3)}
/* destaque: fora do ideal = fonte vermelha (alta em negrito); bem acima = linha vermelha, fonte branca */
tr.hl1 td{color:var(--crit)}tr.hl2 td{color:var(--crit);font-weight:600}
tr.hl3 td{background:var(--crit-strong);color:#fff;font-weight:600}tr.hl3:hover td{background:#741010}
tr.hl1 td *,tr.hl2 td *{color:inherit}
tr.hl3 td *{color:#fff!important;border-color:rgba(255,255,255,.6)!important;background:transparent!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend span b{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}

.lv{display:inline-block;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:600;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.lv0{background:var(--none-bg);color:var(--none)}.lv1{background:var(--warn-bg);color:var(--warn)}.lv2{background:var(--crit-bg);color:var(--crit)}.lv3{background:var(--crit-strong);color:#fff}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;color:var(--muted);margin-left:3px}
.tag.r{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));color:var(--crit)}.tag.o{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}.tag.b{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.i{display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:italic 700 11px/1 Georgia,serif;align-items:center;justify-content:center;cursor:help;text-transform:none;letter-spacing:0}
.note{background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 40%,var(--line));padding:8px 12px;border-radius:var(--r);font-size:13px;margin:8px 0}
.note.w{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}.note.e{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:1150px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--r);display:none;z-index:60;max-width:90vw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px;margin-bottom:8px}
.form input,.form select,.form textarea{width:100%}
.form input[type=checkbox]{width:auto}
.form label.b{display:inline-flex;flex-direction:row;font-size:14px;color:var(--ink);margin:0}
.form td label{display:inline-flex;flex-direction:row;align-items:center;gap:4px;margin:0}
svg text{font-family:var(--f-body)}
.small{font-size:12.5px}
.hist{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}
.hist .h{font-size:11px;color:var(--muted)}
.logoprev{display:flex;align-items:center;min-height:52px;padding:6px 10px;background:var(--surface-3);border:1px dashed var(--line);border-radius:var(--r);margin-bottom:8px}
.logoprev img{height:42px;width:auto;max-width:220px;object-fit:contain}
@media print{.top,nav,.filters,.testband,#toast{display:none!important}.card,.kpis{break-inside:avoid}}

/* ===== ajuda ⓘ (igual ao OEE) ===== */
.ib{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font:italic 700 11px/1 Georgia,serif;cursor:pointer;padding:0;margin-left:4px;vertical-align:middle;text-transform:none;letter-spacing:0;flex:none}
.ib:hover,.ib:focus-visible,.ib[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ipop{position:absolute;z-index:400;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px 12px;font-size:13px;line-height:1.45;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400;max-width:340px}
.ipop .ipt{display:block;font-family:var(--f-display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
/* ===== modo TV (igual ao OEE) ===== */
.tv{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;padding:18px 26px;overflow:hidden}
.tv header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tv .tvlogo{height:46px;width:auto;max-width:240px;object-fit:contain}
.tv header h1{font-family:var(--f-display);font-size:34px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.tv header .st{font-family:var(--f-display);font-size:22px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tv header .clock{margin-left:auto;font-family:var(--f-display);font-size:40px;font-weight:600;font-variant-numeric:tabular-nums}
.tv .tvb{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0;margin-top:12px;overflow:hidden}
.tv .big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.tv .bk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.tv .bk .l{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tv .bk .v{font-family:var(--f-display);font-size:60px;font-weight:700;line-height:1.05}
.tv .bk .v.sm{font-size:42px}
.tv .bk .s{font-size:18px;color:var(--muted)}
.tv .card h3{font-size:22px}
.tv table{font-size:18px}
.tv .tvfoot{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin-top:8px}
.tv .dots{display:flex;gap:6px}.tv .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.tv .dots i.on{background:var(--accent)}
.tv .pl li{font-size:20px;padding:10px 0}.tv .pl .b{display:none}.tv .pill{font-size:16px}
@media(max-width:900px){.tv .big{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ===== relatórios ===== */
.rep{background:#fff;color:#15222f;border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;font-family:var(--f-body)}
.rep h1{font-family:var(--f-display);text-transform:uppercase;font-size:24px;margin:0}
.rep h2{font-family:var(--f-display);text-transform:uppercase;font-size:17px;margin:16px 0 6px;letter-spacing:.04em}
.rep .rk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rep .rk div{border:1px solid #d3dae2;border-radius:6px;padding:8px 10px}
.rep .rk b{display:block;font-family:var(--f-display);font-size:22px}
.rep .rk span{font-family:var(--f-display);text-transform:uppercase;font-size:12px;color:#5b6979;letter-spacing:.05em}
.rep table th{background:#f6f8fa;color:#5b6979;position:static}
.rep table td,.rep table th{color:#15222f;border-color:#d3dae2}
.rep .cm{border-left:4px solid #1d4b73;background:#e3ecf5;padding:8px 12px;margin:10px 0;white-space:pre-wrap}
.repbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* ===== cartões do portal / modelo ===== */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod>header{display:flex;align-items:center;gap:10px}
.mod>header h2{flex:1;font-size:20px}
.mod .mk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mod .mk div{background:var(--surface);padding:8px 10px}
.mod .mk .l{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mod .mk .v{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.mod .mk .s{font-size:12px;color:var(--muted)}
.mod footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.mod.off{opacity:.75}
.pl{list-style:none;margin:0;padding:0}
.pl li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pl li:last-child{border-bottom:0}
.pl li .t{flex:1;min-width:0}
/* ===== avisos (toasts) ===== */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:600;max-width:92vw;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--r);box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13.5px}
.toast.err{background:var(--crit);color:#fff}
/* ===== cadastros (cadastro base) ===== */

  if(remote){if(this.pending&&remote.data.rev===this.pendFrom){await this.writeRemote();this.pending=false;toast('Alterações feitas sem a pasta foram gravadas.')}
    else{if(this.pending){downloadBlob(new Blob([JSON.stringify(this.B)],{type:'application/json'}),PAGE.baseFile.replace('.json','')+'_NAO-GRAVADO_'+todayISO()+'.json');toast('A base da pasta mudou enquanto você estava sem acesso. Suas alterações locais foram baixadas para conferência.',8000)}

const Report={

  const hl={hl1:'color:#c22a2a',hl2:'color:#c22a2a;font-weight:bold',hl3:'background:#8f1515;color:#fff;font-weight:bold'};
  let h=`<div class="rep" ${inline?'style="font-family:Arial,sans-serif;color:#15222f"':''}><div style="display:flex;align-items:center;gap:12px">${doc._logo?`<img src="${doc._logo}" style="height:40px">`:''}<div><h1 ${inline?'style="margin:0;font-size:22px;text-transform:uppercase"':''}>${esc(doc.titulo)}</h1><div style="color:#5b6979">${esc(doc.subtitulo||'')}${doc.periodo?' · '+esc(doc.periodo):''} · gerado em ${fmtDT(nowISO())}${user()?' por '+esc(user()):''}</div></div></div>`;

  for(const b of doc.blocos||[]){if(b.titulo)h+=`<h2 ${inline?'style="font-size:15px;text-transform:uppercase;margin:16px 0 6px"':''}>${esc(b.titulo)}</h2>`;
   if(b.tipo==='kpis')h+=inline?`<table style="${S.t}"><tr>${b.itens.map(k=>`<td style="border:1px solid #d3dae2;padding:6px 8px;vertical-align:top"><div style="font-size:11px;color:#5b6979;text-transform:uppercase">${esc(k[0])}</div><div style="font-size:18px;font-weight:bold;color:${k[3]==='bad'?'#c22a2a':k[3]==='good'?'#1d8048':'#15222f'}">${esc(k[1])}</div><div style="font-size:11px;color:#5b6979">${esc(k[2]||'')}</div></td>`).join('')}</tr></table>`
     :`<div class="rk">${b.itens.map(k=>`<div><span>${esc(k[0])}</span><b class="${k[3]||''}">${esc(k[1])}</b><small class="muted">${esc(k[2]||'')}</small></div>`).join('')}</div>`;

   else if(b.tipo==='texto')h+=`<p style="white-space:pre-wrap">${esc(b.texto)}</p>`;
   else if(b.tipo==='svg'){if(!inline)h+=`<div>${b.svg}</div>`;else if(b._png)h+=`<img src="${b._png}" width="760" alt="${esc(b.titulo||'Gráfico')}" style="display:block;border:0;max-width:100%">`;else h+=`<p style="color:#5b6979;font-size:12px">(gráfico no PDF)</p>`}}

function miniChart(d,{fmt=fmtK,tit=''}={}){if(!d.length)return'';
 const W=290,h=104,pl=4,pr=4,pt=16,pb=16,vals=d.map(x=>+x.value||0);let mx=Math.max(0,...vals),mn=Math.min(0,...vals);if(mx===mn)mx=mn+1;

 s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
 d.forEach((x,i)=>{const X=pl+i*bw+bw*.15,w=Math.max(2,bw*.7),y0=y(0),y1=y(vals[i]),dest=i===iU||i===iM;
  s+=`<g><title>${esc(x.label)}: ${esc(fmt(vals[i]))}</title><rect x="${X}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" fill="${x.color||'var(--accent)'}" opacity="${dest?1:.72}" rx="1.5"/></g>`;
  if(dest)s+=`<text x="${cx(X+w/2)}" y="${vals[i]>=0?Math.max(12,y1-4):Math.min(h-pb+12,y1+13)}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">${esc(fmt(vals[i]))}</text>`});

          (uma meta por família, uma vigência por mês, com OEE, PPH, meta diária e quadro hora a hora); prévia nova / igual / alterada; #cadastros/importar/metaoee.

   1.7.3: catálogo ganha Tipo de item (Tubo / Preparação de aditivo) e Unidade; preparação usa o código SAP do material (sem a regra dos 6 dígitos).
   1.7.2: ⓘ em todos os campos das fichas; catálogo: "Tipo de aditivo" em lista (SST, EDTA, N/A); equipamento: Tipo e Papel em maiúsculas.
   1.7.1: cabeçalho comum v2 (igual nas outras páginas); Portal.html#entrar abre o Entrar (1º acesso vindo das outras páginas).
   1.7: nomes Produção / Waste / Gestão de Gel; Equipamentos, Iniciativas (5S · OSM · KAS) e Projetos; menu Outros; ⚙ Administração (cadastros, usuários e perfis, vigências, parâmetros, configuração);
        entrar pelo ID (autocadastro como Consulta); página inicial por perfil (1x por sessão); vigência gravada não se edita (desativar com motivo); painel de vigências; semáforo central; saída do modo de teste.
   1.1.2: aviso da carga diz qual base foi lida.  1.5: páginas Paradas, Máquinas, Manutenção e Projetos na lista (aparecem quando o HTML chega na pasta).  1.4: lista técnica pela CS12 multinível (itens = nível 1, estrutura = níveis 2+); CS03 sai.  1.3: cabeçalho comum (vac-cabecalho v2: barra do sistema + página + abas), busca Ctrl K, acabamento V1.90, Versões com cabeçalho e último backup.  1.2: Configuração › Versões das páginas (versão e data de cada HTML, gravação das bases, cópias repetidas, histórico).
   ===================================================================== */
const PAGE={id:'portal',titulo:'Portal · Linha Vacutainer',tituloCurto:'Portal',subtitulo:'Sistemas de gestão da linha',versao:'1.9.3',baseFile:'portal-base.json',idb:'vac-portal',backupDir:'00. Backups/Portal',
 vazio:()=>({schema:'portal-base',rev:0,config:{modulos:{},avisoDias:30,notas:{}},audit:[]}),
 /* itens do Portal para a busca Ctrl K: cadastro, pendências e telas */
 busca:q=>{const R=[],D=Cad.D;if(D)for(const t of CAD_ORD){for(const it of D[t]||[]){const c=String(it[kOf(t)]),nm=t==='bom'?((cadItem('catalogos',it.catalogo)||{}).nome||''):it.nome||'';if(norm(c+' '+nm).includes(q))R.push({tipo:CAD_T[t].um,txt:c+(nm?' · '+nm:''),sub:'Cadastros'+(cadAtivo(t,it,D)?'':' · inativo'),href:'#cadastros/'+t+'/'+encodeURIComponent(c)});if(R.length>30)break}}
  allPend().filter(p=>norm(p.txt).includes(q)).slice(0,8).forEach(p=>{const sy=sysOf(p.mod);R.push({tipo:'Pendência',txt:p.txt,sub:sy.nome,href:p.mod==='portal'?'#'+(p.link||'pend'):sysHref(sy,p.link||'')})});
  [['Visão geral','geral'],['Pendências','pend'],['Relatórios','rel'],['Configuração do Portal','config'],['Usuários','cadastros/usuarios'],['Perfis e permissões','cadastros/perfis'],['Vigências','cadastros/vigencias'],['Parâmetros e semáforo','cadastros/parametros'],['Pasta única','config'],['Importar do SAP (BOM, materiais)','cadastros/importar'],['Auditoria do cadastro','cadastros/auditoria'],['Backups do cadastro','cadastros/backups'],['Segurança e senha do cadastro','cadastros/seguranca']].forEach(([t,h])=>{if(norm(t).includes(q))R.push({tipo:'Portal',txt:t,href:'#'+h})});return R},
 exports:b=>({exportsVersion:1,geradoEm:nowISO(),resumo:Object.fromEntries(Object.entries(MOD.data).map(([k,v])=>[k,v&&v.kpis?v.kpis.map(x=>({rotulo:x[0],valor:x[1]})):null]))})};

/* ---------- leitura das bases dos módulos ---------- */
const MOD={data:{},files:{},at:0,busy:false,teste:false};
const CFGP=()=>Store.B.config;
async function findModule(sys){
 const c=(CFGP().modulos||{})[sys.id]||{};let dir=null,pasta='';
 const own=await Store.idb.get('dir:'+sys.id);
 if(own){try{if(await own.queryPermission({mode:'read'})==='granted')dir=vacRaiz(own),pasta=null}catch(e){}}
 if(!dir&&Store.dir){
  const tryIn=async(d,f=sys.base)=>{try{await d.getFileHandle(f);return true}catch(e){return false}};
  /* pasta única: primeiro a pasta principal; depois o local antigo (subpasta guardada ou qualquer subpasta, 1 nível) */
  if(await tryIn(Store.dir)){dir=Store.dir;pasta=''}
  if(!dir&&c.pasta){try{const d=await Store.sub(c.pasta,false);if(await tryIn(d)){dir=d;pasta=c.pasta}}catch(e){}}
  if(!dir){let n=0;for await(const[name,h]of Store.dir.entries()){if(h.kind!=='directory'||/^00\. |^lib$|^Equipamentos$/i.test(name))continue;if(++n>60)break;if(await tryIn(h)){dir=h;pasta=name;break}}}}
 if(!dir)return null;
 /* HTML do módulo: nome padrão, o guardado em vac.sistemas e os nomes antigos (ex.: Gel = Gestão-Gel-Vacutainer.html, antes controle-fifo-gel.html);
    compara também sem acento/maiúsculas, porque o Windows pode gravar o "ã" de outro jeito */
 const def=DEFAULT_SYSTEMS.find(x=>x.id===sys.id)||{};const nomes=[...new Set([def.html,String(sys.html||'').split('/').pop(),...(def.alt||[])].filter(Boolean))];
 const achaHtml=async d=>{for(const n of nomes){try{await d.getFileHandle(n);return n}catch(e){}}try{const alvo=new Set(nomes.map(norm));for await(const[n,h]of d.entries())if(h.kind==='file'&&alvo.has(norm(n)))return n}catch(e){}return null};
 let html=null;if(Store.dir){const n=await achaHtml(Store.dir);if(n)html=n}if(!html&&pasta){const n=await achaHtml(dir);if(n)html=pasta+'/'+n}
 return{dir,pasta,html,antigo:!!pasta}}
const BKP_MOD={portal:'Portal',oee:'OEE',gel:'Gel',perdas:'Perdas',paradas:'Paradas',equip:'Equipamentos',inic:'Iniciativas',maquinas:'Maquinas',manut:'Manutencao',projetos:'Projetos'};
/* 1.8.7 · base que some (ou passa a dar erro) troca os números pelo aviso e sobe MOD.versao: a tela redesenha e não fica mostrando valores antigos.
   Esquece o arquivo lido, para a base reaparecer sempre reprocessada. */
function modErro(s,er){if(!MOD.data[s.id]||MOD.data[s.id].erro!==er)MOD.versao=(MOD.versao||0)+1;MOD.data[s.id]={sys:s,erro:er};delete MOD.files[s.id]}
/* 1.8.12 · página em construção: o HTML está na pasta e ainda não tem base. Lê só as abas planejadas (<script type="application/json" id="vac-planejado">) */
async function modConstrucao(s){let pl=null,ver=null;
 try{const f=await (await Store.dir.getFileHandle(sysHref(s))).getFile(),t=await f.text(),m=/<script type="application\/json" id="vac-planejado">([\s\S]*?)<\/script>/.exec(t);if(m)pl=JSON.parse(m[1]);ver=versaoHtml(t).v}catch(e){}
 const k=JSON.stringify([pl,ver]);if(!MOD.data[s.id]||MOD.data[s.id]._k!==k)MOD.versao=(MOD.versao||0)+1;MOD.data[s.id]={sys:s,construcao:true,planejado:pl,versaoHtml:ver,pend:[],kpis:[],_k:k};delete MOD.files[s.id]}
const emConstr=s=>!!(MOD.data[s.id]&&MOD.data[s.id].construcao);
async function readModules(force){
 if(MOD.teste)return;if(Store.mode!=='pasta'||!Store.dir){MOD.data={};return}
 if(MOD.busy)return;MOD.busy=true;
 try{for(const s of systems()){if(s.id==='portal'||!s.base)continue;
   try{if(s.futuro&&Store.dir){try{await Store.dir.getFileHandle(s.html);const l=systems().map(x=>x.id===s.id?{...x,futuro:false}:x);localStorage.setItem('vac.sistemas',JSON.stringify(l));s.futuro=false;toast(`Página nova encontrada na pasta: ${s.nome}.`)}catch(e){}}
    const loc=await findModule(s);if(!loc&&!s.futuro&&(vacEstadoDe(s.id)||{}).estado==='construcao'){await modConstrucao(s);continue}if(!loc){modErro(s,s.futuro?'Página ainda não criada (o HTML não está na pasta).':'Não encontrei '+s.base+' na pasta do Portal nem nas subpastas.');continue}
    if(loc.html&&loc.html!==s.html)saveSysPath(s.id,loc.html);
    const f=await (await loc.dir.getFileHandle(s.base)).getFile();
    if(!force&&MOD.files[s.id]&&MOD.files[s.id].mod===f.lastModified&&MOD.files[s.id].pasta===loc.pasta&&MOD.files[s.id].dia===todayISO()&&MOD.data[s.id]&&!MOD.data[s.id].erro)continue;
    const d=JSON.parse(await f.text());MOD.files[s.id]={mod:f.lastModified,size:f.size,pasta:loc.pasta,antigo:loc.antigo,dia:todayISO()};
    MOD.data[s.id]=adapt(s,d,f.lastModified);MOD.data[s.id].antigo=loc.antigo;MOD.data[s.id].pasta=loc.pasta;MOD.versao=(MOD.versao||0)+1}
   catch(e){console.warn(s.id,e);modErro(s,'Erro ao ler '+s.base+': '+(e.message||e))}}}
 finally{MOD.busy=false;MOD.at=Date.now()}}
function saveSysPath(id,html){const list=systems().map(x=>x.id===id?{...x,html}:x);localStorage.setItem('vac.sistemas',JSON.stringify(list))}
function adapt(s,d,mod){const f={oee:adaptOEE,gel:adaptGel,perdas:adaptPerdas,paradas:adaptParadas}[s.id]||adaptGeneric;const r=f(d);r.ex=exV1(d.exports)?d.exports:null;if(s.id==='paradas'&&exV1(d.exports)&&d.exports.cadastros)r.cadProp=d.exports.cadastros;r.sys=s;(r.pend||[]).forEach(p=>{if(!p.mod)p.mod=s.id});r.mod=mod;r.updatedAt=d.updatedAt||d.savedAt||d.lastSavedAt||d.lastModifiedAt||null;r.updatedBy=d.updatedBy||d.savedBy||d.lastModifiedBy||'';r.temExports=!!d.exports;return r}
/* ----- severidade: no exports das páginas (exportsVersion 1) sev 1 = urgente, 2 = atenção.
   Dentro do Portal a escala é 2 = urgente, 1 = atenção: converte aqui, na entrada (Portal 1.8.3). ----- */
const sevDoModulo=s=>+s===1?2:1;
/* aPartirDe (opcional): a pendência só vale a partir desse dia (ex.: ação do Waste que vence sem nova gravação lá) */
const pendDoModulo=(ex,mod)=>{const hoje=todayISO();return(ex&&Array.isArray(ex.pendencias)?ex.pendencias:[]).filter(p=>p&&p.txt&&(!p.aPartirDe||p.aPartirDe<=hoje)).map(p=>({sev:sevDoModulo(p.sev),mod,txt:String(p.txt),link:p.link||'',quando:p.quando||'',tipo:p.tipo||'',responsavel:p.responsavel||'',apoios:Array.isArray(p.apoios)?p.apoios:[],prazo:p.prazo||null,id:p.id||null}))};
const exV1=ex=>!!ex&&(ex.exportsVersion==null||+ex.exportsVersion===1);

/* ----- OEE: números, pendências e série vêm do exports do OEE (o motor dele); sem exports soma a produção lançada (dados brutos) ----- */
function adaptOEE(d){const ex=d.exports;
 if(exV1(ex)&&Array.isArray(ex.porMes)&&Array.isArray(ex.kpis)){const hoje=todayISO(),mes=curM(),m=ex.porMes.find(p=>p.mes===mes)||null;
  const serie=(ex.porDia||[]).filter(x=>x.dia>=addDays(hoje,-20)&&x.dia<=hoje).sort((a,b)=>a.dia<b.dia?-1:1).map(x=>({label:x.dia.slice(8,10)+'/'+x.dia.slice(5,7),value:+x.boa||0,key:x.dia}));
  const emProd=(ex.ordens||[]).filter(o=>o.mes===mes&&o.inicioReal&&!o.fimReal).map(o=>`${o.ordem} · lote ${o.lote||'–'}`);
  return{kpis:ex.kpis,pend:pendDoModulo(ex,'oee'),serie,serieTit:'Produção boa por dia · últimos 21 dias (peças)',extra:{emProd},oeePct:m?m.oee:null}}
 return adaptOEEBruto(d)}
function adaptOEEBruto(d){
 const hoje=todayISO(),mes=curM();
 const off=new Set((d.calendar||[]).filter(c=>!c.deleted&&c.kind==='off').map(c=>c.date));
 const days=(d.productionDays||[]).filter(x=>!x.deleted&&!x.demo);
 const dayGood=x=>{let g=0,sc=0;for(const ps of x.shifts||[]){if(ps.off)continue;if(ps.summary&&ps.summary.segments)g+=sum(ps.summary.segments,s=>s.good);else g+=sum(ps.intervals||[],i=>i.good);sc+=+(ps.scrap!=null?ps.scrap:(ps.summary&&ps.summary.scrap)||0)||0}return{g,sc}};
 const byDate={};for(const x of days){if(off.has(x.date))continue;const r=dayGood(x);const o=byDate[x.date]||(byDate[x.date]={g:0,sc:0});o.g+=r.g;o.sc+=r.sc}
 const datas=Object.keys(byDate).sort();const ult=[...datas].reverse().find(dt=>dt<=hoje&&byDate[dt].g>0);
 const mesG=sum(datas.filter(dt=>dt.startsWith(mes)),dt=>byDate[dt].g),mesS=sum(datas.filter(dt=>dt.startsWith(mes)),dt=>byDate[dt].sc);
 const plan=(d.monthPlans||[]).find(p=>!p.deleted&&p.month===mes);const vs=plan&&plan.versions||[];const planTot=vs.length?sum(vs[vs.length-1].items||[],i=>i.qty):null;
 const pend=[];const fam=id=>((d.catalogs||[]).find(c=>c.id===id)||{}).code||'';
 for(const x of days)for(const ps of x.shifts||[]){if(ps.status==='pendente de conferência')pend.push({sev:1,mod:'oee',txt:`Turno ${ps.snap&&ps.snap.name||''} de ${fmtD(x.date)} aguardando conferência`,link:'',quando:x.date})}
 for(const x of days)if(x.date<hoje&&(x.status==='em lançamento'||x.status==='não iniciado')&&!off.has(x.date))pend.push({sev:x.date<addDays(hoje,-2)?2:1,mod:'oee',txt:`Lançamento de ${fmtD(x.date)} ainda aberto (${x.status})`,quando:x.date});
 const ords=plan&&plan.orders||[];const emProd=ords.filter(o=>o.startReal&&!o.endReal);
 const ex=exV1(d.exports)?d.exports:null;let oeeMes=null,oeeMeta=null;
 if(ex&&ex.porMes){const m=(ex.porMes||[]).find(p=>(p.mes||p.per||p.month)===mes);if(m){oeeMes=m.oee;oeeMeta=m.oeeMeta??m.oeeTarget}}
 const serie=datas.filter(dt=>dt>=addDays(hoje,-20)&&dt<=hoje).map(dt=>({label:dt.slice(8,10)+'/'+dt.slice(5,7),value:byDate[dt].g,key:dt}));
 const kpis=[
  ['Produção boa no mês',fmtK(mesG),plan?`plano ${fmtK(planTot)} · ${fmtP(planTot?mesG/planTot:null,0)}`:'sem plano do mês cadastrado',planTot&&mesG/planTot<0.9?'':''],
  [oeeMes!=null?'OEE do mês':'Último dia lançado',oeeMes!=null?fmtP(oeeMes):ult?fmtK(byDate[ult].g):'–',oeeMes!=null?(oeeMeta!=null?'meta '+fmtP(oeeMeta):''):ult?fmtD(ult):'nenhum',oeeMes!=null&&oeeMeta!=null?(oeeMes>=oeeMeta?'good':'bad'):''],
  ['Scrap no mês',fmtK(mesS),fmtP(mesG+mesS?mesS/(mesG+mesS):null,2)+' do processado',''],
  ['Pendências',String(pend.length),pend.length?'turnos e lançamentos':'nada pendente',pend.length?'bad':'good']];
 return{kpis,pend,serie,serieTit:'Produção boa por dia · últimos 21 dias (peças)',extra:{plan:!!plan,planTot,mesG,ordens:ords.length,emProd:emProd.map(o=>`${o.order} · lote ${o.lot||'–'}`),ult},oeePct:oeeMes,bruto:true};
}
/* ----- Gel: saldo (já descontadas as retiradas parciais), validade e pendências vêm do exports do Gel; sem exports, dados brutos ----- */
function adaptGel(d){const ex=d.exports;
 if(exV1(ex)&&ex.estoque&&Array.isArray(ex.kpis)){const pl=Array.isArray(ex.estoque.porLocal)?ex.estoque.porLocal:[];
  const serie=pl.slice().sort((a,b)=>b.kg-a.kg).slice(0,8).map(x=>({label:x.local||'sem local',value:+x.kg||0,key:x.local||''}));

function aplicarMud(alvo,o,L){const conf=[];

 if(conf.length)return{ok:false,tipo:'campos',campos:conf,motivo:conf.map(x=>`"${x.campo}" foi mudado por outra pessoa`).join('; ')};
 for(const[c,m]of Object.entries(o.mudancas||{})){const cur=alvo[c];if(deq(cur,m.depois))continue;if(m.depois==null)delete alvo[c];else alvo[c]=clone(m.depois);L(c,clone(cur),clone(m.depois))}
 return{ok:true}}
const opTxt=o=>{const T=CAD_T[o.tipo];const alvo=o.tipo==='seguranca'?'segurança':o.tipo==='parametros'?'parâmetros':o.tipo==='*'?'cadastro inteiro':(T?T.um:o.tipo)+' '+(o.codigo||'');
 const campos=o.mudancas?Object.keys(o.mudancas).filter(c=>!/senha|salt/i.test(c)).join(', '):'';return`${o.acao} · ${alvo}${campos?' ('+campos+')':''}`};
const audTxt=v=>{if(v==null)return'';if(Array.isArray(v)&&v.length&&v[0]&&typeof v[0]==='object'&&'de'in v[0])return v.map(x=>`${fmtD(x.de)}→${x.ate?fmtD(x.ate):'…'}`+Object.entries(x).filter(([k])=>!['de','ate','itens','pausas'].includes(k)&&x[k]!=null).map(([k,y])=>` ${k}=${Array.isArray(y)?y.join('/'):y}`).join('')+(x.itens?` ${x.itens.length} itens`:'')+(x.estrutura&&x.estrutura.length?` +${x.estrutura.length} estrutura`:'')+(x.fonte?` ${x.fonte}`:'')+(x.pausas&&x.pausas.length?` pausas ${x.pausas.map(p=>p.inicio+'–'+p.fim).join(',')}`:'')).join(' | ');
 if(typeof v==='object'){const s=JSON.stringify(v);return s.length>160?s.slice(0,160)+'…':s}return String(v)};

 /* perfil que edita sem senha (campo semSenha; ADMIN vale por padrão enquanto o campo não for gravado como desmarcado) */
 porPerfil(){if(!Cad.D)return false;const p=perfilAtual(Cad.D);return!!p&&p.ativo!==false&&(p.semSenha===true||(p.semSenha==null&&p.codigo==='ADMIN'))},

 /* C1 · cada alteração do cadastro é um registro na fila durável do kit; esta aba só grava e apaga as dela (as de outra aba ficam) */

 async ler(){if(Store.mode==='teste'||this.gravando)return false;if(Store.mode!=='pasta'||!Store.dir){if(this.base&&this.fonte==='pasta')this.fonte='copia';return false}

  catch(e){if(e&&e.name==='NotFoundError'){const a=this.fonte;this.fonte=this.base?'sumiu':'nenhum';this.mod=0;return a!==this.fonte}this.err='Não consegui ler o cadastro: '+(e.message||e);return false}

  const v=cadValida(d);if(v.length){this.fonte='erro';this.err=CAD_FILE+': '+v.join('; ');return true}

  else if(this.fonte==='erro')m=this.err;else if(this.fonte==='sumiu')m='O arquivo do cadastro não está na pasta. Recrie a partir da cópia local ou restaure um backup.';
  else if(this.status==='conflito')m='Resolva o conflito de gravação primeiro.';else if(!Lock.ok())m='Desbloqueie a edição (senha).';

 async gravar(){
  if(this.gravando){this.denovo=true;return}
  if(!this.fila.length){this.status='salvo';return}
  if(Store.mode==='teste')return this.gravarTeste();
  if(Store.mode!=='pasta'||!Store.dir){this.status='pendente';this.render();return}
  if(this.status==='conflito')return;
  this.gravando=true;this.status='gravando';renderTop();let reapl=false;
  try{for(let volta=0;volta<6&&this.fila.length;volta++){this.denovo=false;const lote=this.fila.slice();
    /* 1. versão atual da pasta */
    let txt=null,remoto=null;
    try{const f=await (await Store.dir.getFileHandle(CAD_FILE)).getFile();txt=await f.text();remoto=JSON.parse(txt);const v=cadValida(remoto);if(v.length)throw new Error('o arquivo na pasta está com problema ('+v[0]+'); nada foi gravado')}
    catch(e){if(!(e&&e.name==='NotFoundError'))throw e}
    if(remoto&&this.base&&(remoto.rev!==this.base.rev||remoto.revId!==this.base.revId))reapl=true;
    /* 2. reaplicar a fila sobre ela */
    let novo=remoto?cadFix(clone(remoto)):null;const aud=[],conf=[];
    for(const o of lote){
     if(o.acao==='carga'){if(novo){conf.push({op:o,tipo:'carga',motivo:`já existe um cadastro na pasta (rev ${novo.rev}, gravado por ${novo.revBy||'outra pessoa'})`});continue}
      novo=cadFix(clone(o.doc));const n0=CAD_ORD.map(t=>[t,novo[t].length]).filter(x=>x[1]);
      if(!novo.auditoria.length){n0.forEach(([t,n])=>aud.push({em:o.em,por:o.por,acao:'criação',tipo:t,codigo:null,campo:null,antes:null,depois:`${n} item(ns)`,motivo:o.motivo||null,origem:o.origem||null}));aud.push({em:o.em,por:o.por,acao:'senha',tipo:'seguranca',codigo:null,campo:null,antes:null,depois:'senha inicial definida',motivo:o.motivo||null})}
      else aud.push({em:o.em,por:o.por,acao:'criação',tipo:'*',codigo:null,campo:null,antes:null,depois:`arquivo recriado (rev ${novo.rev})`,motivo:o.motivo||null});continue}
     if(!novo){conf.push({op:o,tipo:'sumiu',motivo:'o cadastro não existe na pasta'});continue}
     const r=aplicarOp(novo,o,aud);if(!r.ok)conf.push({op:o,...r})}

    /* 3. backup da versão atual */

    /* 4. gravar rev + 1 */
    novo.rev=Math.max(remoto?remoto.rev||0:0,novo.rev||0)+1;novo.revBy=user();novo.revAt=isoLocal();novo.revId=uid('r');novo.appVersion='Portal '+PAGE.versao;novo.schema='vac-cadastros';novo.schemaVersion=1;

<script>
/* ----- vac-cabecalho v2.1 · 05/11/2026 (igual em todas as páginas; não editar só numa) -----
   1) ← Voltar ao lado do título: volta para a tela anterior (aba da página ou página anterior), igual ao botão voltar do navegador.
      As abas da página entram no histórico do navegador: clique numa aba = nova entrada; voltar = clica de novo na aba anterior.
      A página pode definir vacNavAtual() → {attr,val,sub} quando a aba atual não é o botão marcado (ex.: Produção).
   2) Ao voltar para a página (troca de aba/janela, ← Voltar, página restaurada), chama vacAoVoltar() se a página definir,
      para reler o que outras páginas gravaram sem precisar de F5. */
(() => {
  if (window.__vacV21) return; window.__vacV21 = 1;
  const SEL = '#nav [data-route],#nav [data-t],#nav [data-tab],[role=tab][data-tab]';
  const ATR = ['data-route', 'data-t', 'data-tab'];
  const doEl = el => { for (const a of ATR) if (el.hasAttribute(a)) return { attr: a, val: el.getAttribute(a), sub: el.getAttribute('data-osub2') || null }; return null; };
  const atual = el => {
    if (typeof vacNavAtual === 'function') { try { const v = vacNavAtual(); if (v) return v; } catch (e) { } }
    if (el) return doEl(el);
    const on = document.querySelector('#nav .on[data-t],#nav button.on,#nav [aria-current=page],#nav [aria-selected=true],[role=tab][data-tab][aria-selected=true]');
    return on ? doEl(on) : null;
  };
  /* páginas que limpam o estado do histórico (replaceState(null…)) não apagam a posição gravada */
  try { const rs = history.replaceState.bind(history); history.replaceState = function (st, t, u) { if (st == null && history.state && history.state.vacNav) st = { vacNav: history.state.vacNav }; return rs(st, t, u); }; } catch (e) { }
  let restaurando = false;
  document.addEventListener('click', e => {
    if (restaurando) return; const el = e.target.closest && e.target.closest(SEL); if (!el) return;
    const antes = atual(null);
    setTimeout(() => {
      const depois = atual(el); if (!depois || JSON.stringify(depois) === JSON.stringify(antes)) return;
      try { if (antes && !(history.state && history.state.vacNav)) history.replaceState({ ...(history.state || {}), vacNav: antes }, ''); history.pushState({ vacNav: depois }, ''); } catch (x) { }
      vacVoltarRender();
    }, 0);
  }, true);
  window.addEventListener('popstate', e => {
    const v = e.state && e.state.vacNav; vacVoltarRender(); if (!v) return;
    const cs = [...document.querySelectorAll(SEL)].filter(x => x.getAttribute(v.attr) === v.val); if (!cs.length) return;
    const el = cs.find(x => (x.getAttribute('data-osub2') || null) === (v.sub || null)) || cs[0];
    restaurando = true; try { el.click(); } finally { setTimeout(() => { restaurando = false; }, 0); }
  });
  function vacVoltarRender() {
    const t = document.getElementById('vacTitulo'); if (!t) return; let b = document.getElementById('vacVoltar');
    if (!b) {
      if (!document.getElementById('vacVoltarCss')) { const st = document.createElement('style'); st.id = 'vacVoltarCss'; st.textContent = '.vvoltar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:10px;border:1px solid var(--line,#d0d7e2);border-radius:8px;background:transparent;color:inherit;font-size:17px;line-height:1;cursor:pointer;vertical-align:middle;flex:none}.vvoltar:hover{background:var(--hover,rgba(127,127,127,.12))}.vvoltar[hidden]{display:none!important}'; document.head.appendChild(st); }
      t.insertAdjacentHTML('beforebegin', '<button type="button" id="vacVoltar" class="vvoltar" title="Voltar para a tela anterior (igual ao voltar do navegador · Alt+←)" aria-label="Voltar">←</button>');
      b = document.getElementById('vacVoltar'); b.onclick = () => history.back();
    }

  }
  window.vacVoltarRender = vacVoltarRender;
  let ult = 0;
  const voltou = () => { if (document.hidden) return; const n = Date.now(); if (n - ult < 1500) return; ult = n; vacVoltarRender(); try { if (typeof vacAoVoltar === 'function') vacAoVoltar(); } catch (e) { console.warn('vacAoVoltar', e); } };
  document.addEventListener('visibilitychange', voltou); window.addEventListener('focus', voltou); window.addEventListener('pageshow', e => { vacVoltarRender(); if (e.persisted) voltou(); });
  setInterval(() => { if (!document.getElementById('vacVoltar')) vacVoltarRender(); }, 1500);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', vacVoltarRender); else setTimeout(vacVoltarRender, 0);
})();
/* kit v2.1 · câmbio do cadastro geral (Portal › Câmbio): cotação vigente numa data, em R$ por 1 unidade da moeda. null = sem cadastro. */
/* kit v2.1 · E2 (08/11/2026): "hoje" no dia local do computador (antes, sem data, valia o dia em UTC: às 22h de Brasília já era amanhã).
   Os leitores abaixo usam a data do fato quando recebem uma; vacHoje() é só o padrão quando não recebem. */
function vacHoje() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
function vacCambio(data, moeda = 'USD') {
  const c = typeof vacCad === 'function' ? vacCad() : null, m = c && (c.cambio || []).find(x => String(x.codigo).toUpperCase() === moeda && x.ativo !== false); if (!m) return null;
  const d = String(data || '').slice(0, 10) || vacHoje();
  const v = (m.vigencias || []).filter(x => x.de <= d && (!x.ate || x.ate >= d)).sort((a, b) => a.de < b.de ? 1 : -1)[0];
  return v && +v.cotacao > 0 ? { cotacao: +v.cotacao, de: v.de, ate: v.ate || null } : null;
}
/* kit v2.1 · leituras do cadastro geral (cópia vac.cadastros), iguais em todas as páginas */
const vacVig = (vs, data) => { const d = String(data || '').slice(0, 10) || vacHoje(); return (vs || []).filter(v => v.de <= d && (!v.ate || v.ate >= d)).sort((a, b) => a.de < b.de ? 1 : -1)[0] || null; };
function vacParam(k) { const c = typeof vacCad === 'function' ? vacCad() : null; return c && c.parametros ? c.parametros[k] ?? null : null; }

function vacTurnosEm(data) { const c = typeof vacCad === 'function' ? vacCad() : null; return (c && c.turnos || []).filter(t => t.ativo !== false).map(t => { const v = vacVig(t.vigencias, data); return v ? { codigo: t.codigo, nome: t.nome, ...v } : null; }).filter(Boolean); }

function vacPrecoEm(material, data) { const c = typeof vacCad === 'function' ? vacCad() : null; const it = c && (c.precos || []).find(p => String(p.material) === String(material)); const v = it ? vacVig(it.vigencias, data) : null; return v && +v.preco > 0 ? { preco: +v.preco, moeda: v.moeda || 'USD', porUnidade: v.porUnidade || 'kg', de: v.de } : null; }
