/* --- tokens comuns: texto sobre preenchimento forte e contadores (contraste ≥ 4,5 nos dois temas) --- */

/* --- cores de estado iguais em todas as páginas (V04): verde = adequado, âmbar = atenção, vermelho = crítico, azul = informação,

const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const LS_TEXTO=new Set(['vac.theme','vac.user','vac.userId','vac.perfil','vac.logo']);
const LS={get(k,d){try{const v=localStorage.getItem(k);if(v==null)return d;if(LS_TEXTO.has(k)){if(/^".*"$/s.test(v)){try{return JSON.parse(v)}catch(e){}}return v}return JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,LS_TEXTO.has(k)?String(v):JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?7000:3800)}
function user(){return LS.get('vac.user','')||''}
function applyTheme(){const t=LS.get('vac.theme','auto');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
function cycleTheme(){const o=['auto','light','dark'];const t=LS.get('vac.theme','auto');LS.set('vac.theme',o[(o.indexOf(t)+1)%3]);applyTheme();toast('Tema: '+({auto:'automático',light:'claro',dark:'escuro'})[LS.get('vac.theme')])}
const help=t=>`<span class="help" data-help="${esc(t)}">i</span>`;
document.addEventListener('click',e=>{const h=e.target.closest('.help');$$('.pop').forEach(p=>p.remove());if(!h)return;e.stopPropagation();const p=document.createElement('div');p.className='pop';p.innerHTML=esc(h.dataset.help).replace(/\n/g,'<br>');document.body.appendChild(p);
 const r=h.getBoundingClientRect();p.style.left=Math.max(8,Math.min(innerWidth-350,r.left+scrollX-10))+'px';p.style.top=(r.bottom+scrollY+6)+'px'},true);
/* logo: a imagem guardada por outra página (vac.logo) ou Logo.png da pasta */
const Logo={apply(){const im=$('#brandLogo');if(!im)return;const src=LS.get('vac.logo',null)||'Logo.png';im.onload=()=>{im.hidden=false};im.onerror=()=>{im.hidden=true};im.src=src}};

/* ---------- abas: as do PLANO, com subabas (#aba=osm/planner) ---------- */
const ABAS=[{id:'geral',aba:'Visão geral',grupo:PLANO.grupoGeral!==undefined?PLANO.grupoGeral:'Operação'}].concat(PLANO.abas);
const abaDe=id=>ABAS.find(a=>a.id===id);
function rota(){let h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('aba='))h=h.slice(4);const[a,sb]=h.split('/');return abaDe(a)?{aba:a,sub:sb||null}:{aba:'geral',sub:null}}
let atual=rota();
function navHtml(){let g=null,o='';for(const a of ABAS){if(a.grupo!==g){g=a.grupo;if(g)o+=`<span class="grp">${esc(g)}</span>`}o+=`<button data-t="${a.id}" class="${a.id===atual.aba?'on':''}">${esc(a.aba)}</button>`}return o}
function show(aba,sub){atual={aba,sub:sub||null};const h='#aba='+aba+(sub?'/'+sub:'');if(location.hash!==h)history.replaceState(history.state,'',h);render()}
function cadCount(c){const C=vacCad();if(!C)return null;const L=C[c.tipo];if(!Array.isArray(L))return null;return L.filter(x=>x.ativo!==false&&(!c.filtro||Object.entries(c.filtro).every(([k,v])=>x[k]===v))).length}
const linkDe=x=>x.portal?vacPortalHref(x.portal):x.pagina?(()=>{const s=systems().find(y=>y.id===x.pagina);return s&&!s.futuro?sysHref(s,x.hash||''):null})():x.href||null;
function cardAba(a,sub){const S=sub&&(a.subabas||[]).find(x=>x.id===sub);const itens=S?S.itens:a.itens;
 return`<div class="card"><div class="row"><h2 class="ttl">${esc(S?S.nome:a.aba)}</h2><span class="pill none">em construção</span>${a.status?`<span class="pill info">${esc(a.status)}</span>`:''}</div>
 ${S?`<p class="small muted">${esc(a.aba)} › ${esc(S.nome)}</p>`:''}
 <h3 class="sub">O que esta tela vai ter</h3><ul class="lst">${(itens||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
 ${a.fonte?`<h3 class="sub">De onde vêm os dados</h3><p class="small">${esc(a.fonte)}</p>`:''}
 ${(PLANO.docs||[]).length?`<p class="small muted">Referência no repositório: ${PLANO.docs.map(d=>`<span class="code">${esc(d)}</span>`).join(' · ')}</p>`:''}</div>`}
function viewGeral(){const grupos=[...new Set(PLANO.abas.map(a=>a.grupo))];
 const cont=(PLANO.contagens||[]).map(c=>({...c,n:cadCount(c)})).filter(c=>c.n!=null);
 const hoje=(PLANO.hoje||[]).map(x=>({...x,href:linkDe(x)}));
 return`<div class="card aviso"><div class="row"><h2 class="ttl">Esta página está em construção</h2><span class="pill none">v${esc(PAGE.versao)}</span></div>
  <p>${esc(PLANO.nota||'')}</p><p class="small muted">Ainda não grava nada nem pede a pasta. As abas abaixo mostram o que cada tela vai ter; elas mudam conforme o desenho for fechado.</p>
  ${cont.length?`<div class="cont">${cont.map(c=>`<div class="kpi"><div class="l">${esc(c.rot)}</div><div class="v">${c.n}</div><div class="s"><a href="${esc(vacPortalHref('cadastros/'+c.tipo))}">ver no Portal ↗</a></div></div>`).join('')}</div>`:''}</div>
 ${grupos.map(g=>`${g?`<h3 class="grpT">${esc(g)}</h3>`:'<div style="height:14px"></div>'}<div class="grid g3">${PLANO.abas.filter(a=>a.grupo===g).map(a=>`<a class="card abaC" href="#aba=${esc(a.id)}" data-ir="${esc(a.id)}"><div class="row"><b>${esc(a.aba)}</b>${a.status?`<span class="pill info">${esc(a.status)}</span>`:''}</div>
  <ul class="lst small">${(a.itens||[]).slice(0,4).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${(a.subabas||[]).length?`<div class="small muted">Subabas: ${a.subabas.map(s=>esc(s.nome)).join(' · ')}</div>`:''}</a>`).join('')}</div>`).join('')}
 <div class="grid g2" style="margin-top:14px">
  <div class="card"><h3 class="sub" style="margin-top:0">O que já dá para usar hoje</h3>${hoje.length?`<ul class="lst">${hoje.map(x=>`<li>${x.href?`<a href="${esc(x.href)}">${esc(x.txt)} ↗</a>`:esc(x.txt)}${x.obs?` <span class="small muted">${esc(x.obs)}</span>`:''}</li>`).join('')}</ul>`:'<p class="small muted">Nada ainda.</p>'}</div>
  <div class="card"><h3 class="sub" style="margin-top:0">Quando fica pronta</h3><p class="small">${esc(PLANO.entrega||'')}</p></div></div>`}
function render(){const nav=$('#nav');nav.innerHTML=navHtml();
 const a=abaDe(atual.aba)||ABAS[0];let html='';
 if(a.id==='geral')html=viewGeral();
 else{const subs=a.subabas||[];html=(subs.length?`<div class="subtabs" role="tablist">${[{id:null,nome:'Resumo'}].concat(subs).map(s=>`<button role="tab" data-tab="${esc(a.id+(s.id?'/'+s.id:''))}" aria-selected="${(s.id||null)===(atual.sub||null)}">${esc(s.nome)}</button>`).join('')}</div>`:'')+cardAba(a,atual.sub)}
 $('#main').innerHTML=html;
 $$('[data-ir]').forEach(x=>x.onclick=e=>{e.preventDefault();show(x.dataset.ir)});
 $$('.subtabs [data-tab]').forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.tab.split('/');show(x,y)})}
document.addEventListener('click',e=>{const b=e.target.closest('#nav [data-t]');if(b)show(b.dataset.t)});
window.addEventListener('hashchange',()=>{if(location.hash==='#tv')return tv();atual=rota();render()});
/* TV: um slide só (a página ainda não tem números) */
function tv(){const d=document.createElement('div');d.className='tv';d.innerHTML=`<div class="tvh">${esc(PAGE.tituloCurto)} <span class="pill none">em construção</span><span class="sp"></span><button class="b" id="tvX">Sair (Esc)</button></div>
 <div class="tvb"><p style="font-size:22px">${esc(PLANO.nota||'')}</p><div class="grid g3">${PLANO.abas.map(a=>`<div class="card"><b>${esc(a.aba)}</b></div>`).join('')}</div></div>`;document.body.appendChild(d);
 const fim=()=>{d.remove();document.removeEventListener('keydown',k);history.replaceState(history.state,'','#aba='+atual.aba)};const k=e=>{if(e.key==='Escape')fim()};document.addEventListener('keydown',k);d.querySelector('#tvX').onclick=fim}
/* entrada */
applyTheme();Logo.apply();wireCabecalho();renderSysNav();
$('#btnTheme').onclick=cycleTheme;$('#appVer').textContent='v'+PAGE.versao;
$('#stBase').innerHTML='<span class="small">não grava dados (página em construção)</span>';
window.addEventListener('storage',e=>{if(e.key==='vac.theme')applyTheme();if(e.key==='vac.cadastros'&&atual.aba==='geral')render()});
render();if(location.hash==='#tv')tv();
</script>
</body>
</html>
