.vk-dc:hover{border-color:var(--accent,#1565a8)}.vk-dc:focus-visible,.vk-gh:focus-visible{outline:2px solid var(--accent,#1565a8);outline-offset:2px}
.vk-dc .l{font-size:13px;color:var(--muted,#64748b)}.vk-dc .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.vk-dc .s{font-size:13px;color:var(--muted,#64748b)}
.vk-dc[disabled]{cursor:default}.vk-dc[disabled]:hover{border-color:var(--line,#d8e1ec)}
.vk-grp{border:1px solid var(--line,#d8e1ec);border-radius:12px;background:var(--surface-3,var(--bg,transparent));margin:0 0 14px}
.vk-gh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;cursor:pointer;text-align:left;color:inherit;font:inherit;min-height:48px;border-radius:12px}
.vk-gh .seta{width:18px;color:var(--muted,#64748b)}.vk-gh .t{font-family:var(--f-body,system-ui,sans-serif);font-size:16px;font-weight:700}.vk-gh .q{color:var(--muted,#64748b);font-size:13px}.vk-gh .n{margin-left:auto;color:var(--muted,#64748b);font-size:12.5px;white-space:nowrap}
.vk-gb{padding:0 14px 14px}.vk-grp.fechado .vk-gb{display:none}
.vk-est{margin:-2px 0 8px;padding:6px 10px;border-radius:8px;background:var(--warn-bg,rgba(143,90,0,.12));color:var(--warn,#8f5a00);font-size:12.5px;font-weight:600}
@media (max-width:620px){.vk-big{font-size:32px}}
@media print{.vk-grp.fechado .vk-gb{display:block!important}.vk-gh .seta{display:none!important}}
/* estilo do padrão nas demais abas da página que liga a classe vk-estilo no contêiner: cartões de 12 px, títulos e rótulos sem caixa alta */
.vk-estilo .card{border-radius:12px}
.vk-estilo .card>h3,.vk-estilo .card>header h3,.vk-estilo .card h3:first-child{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:17px;font-weight:700}
.vk-estilo .kpi{border-radius:12px}
.vk-estilo .kpi .l{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
/* filtros: no celular, os marcados com vk-opt ficam em "Mais filtros" (botão .vk-mais) */
.vk-mais{display:none}
@media (max-width:700px){.vk-mais{display:inline-flex}.filters:not(.vk-aberto) .vk-opt{display:none!important}}
.vk-estilo .card .sh h2{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:17px;font-weight:700}
a.vk-dc,a.vk-dc:hover{text-decoration:none;color:inherit}
/* Gráficos (docs/graficos-padrao.md): linha "Valores em <unidade>" acima do gráfico cujo eixo não traz a unidade */
.c-un{margin:0 0 2px;font-size:11.5px;color:var(--muted,#64748b)}.c-un b{font-weight:600;color:var(--ink,inherit)}
/* ===== vac-ds v1 · Design System BD · Sistemas da Linha Vacutainer (fontes/kit/kit_ds.css; 12/11/2026) =====
   Especificação: docs/design-system.md. Vem depois do kit_visual.css, no mesmo <style id="vac-visual">; igual em todas as páginas.
   Só apresentação: tokens da paleta, barra lateral, cabeçalho de 58 px, cabeçalho do módulo, abas, cartões, tabelas, grade de gráficos, impressão.
   Nenhum ID, evento, cálculo ou dado muda. O JS correspondente é o fontes/kit/kit_ds.js. */

/* --- 1 · tokens (os nomes das páginas continuam valendo; aqui só mudam os valores) --- */
:root{
  --vds-w:232px;--vds-top:58px;
  --bg:#F2F7FB;--surface:#FFFFFF;--surface-2:#EAF0F5;--surface-3:#F8FBFD;--surface2:#F8FBFD;--ink:#102F55;--muted:#5A6E85;--line:#DCE6EF;
  --accent:#0D5E9C;--accent-ink:#FFFFFF;--accent-soft:#EAF4FC;
  --ok:#14804A;--warn:#8F5A00;--crit:#BF3B3A;--info:#1466A0;--none:#5F7184;--rule:#6B3DB3;--hold:#6B3DB3;--pend:#B5540B;
  --ok-bg:#EAF7EF;--warn-bg:#FFF5DF;--crit-bg:#FDEDED;--info-bg:#EAF4FC;--none-bg:#F0F3F6;--rule-bg:#F3ECFC;--pend-bg:#FFF0E3;
  --ok-fill:#14804A;--warn-fill:#D78B11;--crit-fill:#C94645;--info-fill:#1972AE;--none-fill:#A8B4C1;
  --grid:#E4EBF2;--axis:#B9C6D3;
  --f-body:"Segoe UI",Inter,Arial,sans-serif;--f-display:"Segoe UI",Inter,Arial,sans-serif;
  --r:12px;--sh:0 4px 14px rgba(32,61,88,.06);--sh-hover:0 7px 18px rgba(32,61,88,.10);
  --sb-bg:#102333;--sb-bg2:#0D1E2B;--sb-ink:#C9D8E5;--sb-on:#1972AE;--sb-mark:#57D6B0;--sb-line:rgba(255,255,255,.10);
  --vs-bg:#102333;--vs-ink:#fff;--vs-mut:#C9D8E5;--vs-line:rgba(255,255,255,.10);--vs-hl:#57D6B0;
  --cnt-bg:#B5540B;
}
:root[data-theme="dark"]{
  --bg:#0B1620;--surface:#12212E;--surface-2:#1B2F40;--surface-3:#162736;--surface2:#162736;--ink:#E6EEF6;--muted:#9FB2C5;--line:#27394A;
  --accent:#5FB0EA;--accent-ink:#0B1620;--accent-soft:#17324A;
  --ok:#4FCB8B;--warn:#F0B54C;--crit:#FF7B79;--info:#6FB6EC;--none:#93A3B4;--rule:#B99AF0;--hold:#B99AF0;--pend:#F39A5A;
  --ok-bg:#12301F;--warn-bg:#352A12;--crit-bg:#3A1C1C;--info-bg:#152C42;--none-bg:#1E2B38;--rule-bg:#2A2140;--pend-bg:#3A2414;
  --ok-fill:#2FA56A;--warn-fill:#E3A22B;--crit-fill:#E06160;--info-fill:#3D94D0;--none-fill:#5E7184;
  --grid:#223444;--axis:#3A4E61;--sh:0 4px 14px rgba(0,0,0,.30);--sh-hover:0 7px 18px rgba(0,0,0,.40);
  --sb-bg:#0A141D;--sb-bg2:#070F16;--vs-bg:#0A141D;--cnt-bg:#F39A5A;color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="dark"]){
  --bg:#0B1620;--surface:#12212E;--surface-2:#1B2F40;--surface-3:#162736;--surface2:#162736;--ink:#E6EEF6;--muted:#9FB2C5;--line:#27394A;
  --accent:#5FB0EA;--accent-ink:#0B1620;--accent-soft:#17324A;
  --ok:#4FCB8B;--warn:#F0B54C;--crit:#FF7B79;--info:#6FB6EC;--none:#93A3B4;--rule:#B99AF0;--hold:#B99AF0;--pend:#F39A5A;
  --ok-bg:#12301F;--warn-bg:#352A12;--crit-bg:#3A1C1C;--info-bg:#152C42;--none-bg:#1E2B38;--rule-bg:#2A2140;--pend-bg:#3A2414;
  --ok-fill:#2FA56A;--warn-fill:#E3A22B;--crit-fill:#E06160;--info-fill:#3D94D0;--none-fill:#5E7184;
  --grid:#223444;--axis:#3A4E61;--sh:0 4px 14px rgba(0,0,0,.30);--sh-hover:0 7px 18px rgba(0,0,0,.40);
  --sb-bg:#0A141D;--sb-bg2:#070F16;--vs-bg:#0A141D;--cnt-bg:#F39A5A;color-scheme:dark;
}}
html.vds-rec{--vds-w:72px}
@media (max-width:899px){:root,html.vds-rec{--vds-w:0px}}

/* --- 2 · ícones (Lucide, traço de 2 px; embutidos pelo kit_ds.js) --- */
.vi{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.vi.sm{width:15px;height:15px}.vi.in{margin-right:5px;vertical-align:-2.5px}button:has(>.vi.in:only-child){display:inline-flex;align-items:center;justify-content:center}button>.vi.in:only-child{margin-right:0}.vi.lg{width:22px;height:22px}.vi.xl{width:28px;height:28px}

/* --- 3 · estrutura: barra lateral fixa + conteúdo ao lado --- */
body{padding-left:var(--vds-w);font-family:var(--f-body);transition:padding-left .16s ease}
header.vsuite{position:fixed;top:0;left:0;bottom:0;width:232px;z-index:45;background:linear-gradient(180deg,var(--sb-bg) 0%,var(--sb-bg2) 100%);color:var(--sb-ink);border:0;border-right:1px solid var(--sb-line);overflow:hidden;transition:width .16s ease,transform .18s ease}
html.vds-rec header.vsuite{width:72px}
header.vsuite .wrap{display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:2px;height:100%;min-height:0;max-width:none;margin:0;padding:12px 10px 10px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
header.vsuite .sp{flex:1 1 auto;min-height:8px}
header.vsuite .vds-marca{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;min-height:54px}
header.vsuite .vlogo{height:32px;max-width:64px;background:#fff;border-radius:7px;padding:2px 4px}
header.vsuite .vnm,header.vsuite a#vacNome{display:grid;gap:0;font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;line-height:1.25;white-space:normal;text-decoration:none}
header.vsuite .vnm small{font-size:11px;font-weight:600;color:var(--sb-ink);letter-spacing:.05em}
header.vsuite .vapps,header.vsuite nav.vapps{display:flex;flex-direction:column;align-self:auto;gap:2px;overflow:visible;min-width:0}
header.vsuite .vapps a,header.vsuite .vds-it{box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:40px;width:100%;padding:0 10px 0 9px;border:0;border-left:3px solid transparent;border-bottom:0;border-radius:8px;background:none;font-family:var(--f-body);font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--sb-ink);text-decoration:none;white-space:nowrap;cursor:pointer;text-align:left;position:relative}
header.vsuite .vapps a:hover,header.vsuite .vds-it:hover{background:rgba(255,255,255,.06);color:#fff}
header.vsuite .vapps a.cur,header.vsuite .vds-it.cur{background:var(--sb-on);color:#fff;border-left-color:var(--sb-mark);font-weight:600}
header.vsuite .vapps a:focus-visible,header.vsuite .vds-it:focus-visible,header.vsuite a#vacNome:focus-visible{outline:2px solid var(--sb-mark);outline-offset:-2px}
header.vsuite .vds-it .vds-tx,header.vsuite .vapps a .vds-tx{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
header.vsuite .vds-div{height:1px;background:var(--sb-line);margin:8px 6px}
header.vsuite .vest{margin-left:auto}
header.vsuite #sysOutros{display:block}
header.vsuite #sysOutros details.vmenu>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px 0 12px;border-radius:8px;color:var(--sb-ink);cursor:pointer;font-size:13.5px}
header.vsuite #sysOutros details.vmenu>summary::-webkit-details-marker{display:none}
header.vsuite #sysOutros .vmenu-l{position:static;display:flex;flex-direction:column;background:none;border:0;box-shadow:none;padding:0 0 0 30px;min-width:0}
header.vsuite #sysOutros .vmenu-l a{color:var(--sb-ink);padding:7px 8px;border-radius:6px;font-size:13px;text-decoration:none;white-space:normal}
header.vsuite #sysOutros .vmenu-l a:hover{background:rgba(255,255,255,.06);color:#fff}
header.vsuite .vic{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:40px;width:100%;padding:0 10px 0 12px;border-radius:8px;color:var(--sb-ink);font-size:13.5px;cursor:pointer;white-space:nowrap}
header.vsuite .vic:hover{background:rgba(255,255,255,.06);color:#fff}
header.vsuite .vic:focus-visible{outline:2px solid var(--sb-mark);outline-offset:-2px}
header.vsuite .vdemo-entrar{box-sizing:border-box;display:flex;align-items:center;gap:8px;min-height:36px;margin:8px 2px 0;padding:0 12px;border:1px solid var(--sb-line);border-radius:8px;background:rgba(255,255,255,.04);color:var(--sb-ink);font-size:12.5px;text-align:left}
header.vsuite .vdemo-entrar:hover{color:#fff;background:rgba(255,255,255,.08)}
html.vds-rec header.vsuite .vdemo-entrar{justify-content:center;padding:0;margin-inline:0}html.vds-rec header.vsuite .vdemo-entrar span{display:none}
/* recolhida: só ícones, com o nome no title */
html.vds-rec header.vsuite .vds-tx,html.vds-rec header.vsuite .vnm,html.vds-rec header.vsuite .vest,html.vds-rec header.vsuite #sysOutros{display:none}
html.vds-rec header.vsuite .wrap{padding-inline:10px}
html.vds-rec header.vsuite a#vacNome{display:none}
header.vsuite .vds-sig{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--sb-on);color:#fff;flex:none}
header.vsuite .vlogo:not([hidden])+.vds-sig{display:none}
html.vds-rec header.vsuite .vapps a,html.vds-rec header.vsuite .vds-it,html.vds-rec header.vsuite .vic{justify-content:center;padding:0;gap:0}
html.vds-rec header.vsuite .vds-marca{justify-content:center;padding-inline:0}
html.vds-rec header.vsuite .vlogo{max-width:48px}
/* menu sobreposto abaixo de 900 px */
.vds-fundo{display:none;position:fixed;inset:0;z-index:44;background:rgba(8,18,28,.55);border:0}
@media (max-width:899px){
  header.vsuite,html.vds-rec header.vsuite{width:min(264px,86vw);transform:translateX(-102%);box-shadow:none}
  html.vds-aberta header.vsuite{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  html.vds-aberta .vds-fundo{display:block}
  html.vds-rec header.vsuite .vds-tx,html.vds-rec header.vsuite .vnm{display:revert}
  html.vds-rec header.vsuite .vapps a,html.vds-rec header.vsuite .vds-it,html.vds-rec header.vsuite .vic{justify-content:flex-start;padding:0 10px 0 9px;gap:12px}
}

/* --- 4 · cabeçalho superior (58 px): onde estou, base, busca, usuário --- */
.vds-top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px 14px;min-height:var(--vds-top);box-sizing:border-box;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px 20px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink)}
.vac-demo .vds-top{top:var(--vdemo-h,44px)}
.vds-top .vds-bt{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:40px;height:40px;padding:0 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.vds-top .vds-bt:hover{background:var(--surface-2);color:var(--ink)}
.vds-top .vds-bt:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:1px}
.vds-top .vds-bt.vds-menu{display:none}
.vds-mig{border:0;background:none;box-shadow:none;flex:none;max-width:46%;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap}
.vds-mig a{color:var(--muted);text-decoration:none}.vds-mig a:hover{color:var(--accent);text-decoration:underline}
.vds-mig b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.vds-mig .vi{width:14px;height:14px;opacity:.7}
.vds-top .sp{flex:1 1 auto}
.vds-top #stBase{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;font-size:12.5px}
.vds-top #stBase>*{flex:none}
.vds-top .vbtn-busca{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:38px;min-width:190px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-3);color:var(--muted);font-size:13px;cursor:pointer}
.vds-top .vbtn-busca span{display:inline;flex:1}
.vds-top .vbtn-busca kbd{font:600 11px var(--f-body);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface)}
.vds-top .vbtn-busca:hover{border-color:var(--accent)}
.vds-top .vuser{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);white-space:nowrap}
.vds-top .vuser:empty{display:none}
.vds-top .vuser a{display:inline-flex;align-items:center;gap:8px}
@media (max-width:899px){.vds-top{padding-left:8px}.vds-top .vds-bt.vds-menu{display:inline-flex}.vds-top .vbtn-busca{min-width:40px;width:40px;padding:0;justify-content:center}.vds-top .vbtn-busca span,.vds-top .vbtn-busca kbd{display:none}.vds-top{flex-wrap:wrap}.vds-top #stBase{order:9;flex-basis:100%;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}.vds-mig{max-width:60%}}
@media (max-width:1100px){.vds-top .vbtn-busca{min-width:0}.vds-top .vbtn-busca kbd{display:none}}

/* --- 5 · cabeçalho do módulo: ícone, título, descrição, ações --- */
.vpage{background:var(--surface);border-bottom:0}
.vpage .wrap{max-width:none;margin:0;padding:18px 24px 12px;min-height:0;gap:8px 14px;align-items:center}
.vpage .vds-mod{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;flex:none}
:root[data-theme="dark"] .vpage .vds-mod{color:var(--accent-ink)}
.vpage h1,.vpage #vacTitulo{font-family:var(--f-body);font-size:26px;font-weight:750;letter-spacing:0;text-transform:none;color:var(--ink);margin:0;line-height:1.15}
.vpage .rule,.vpage #vacSub{font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none;border:0;padding:0}
.vpage .ver{font-size:11.5px;color:var(--muted)}
.vpage .vacts>button,.vpage .vacts>.tvmenu>button,.vpage .vacts>details>summary{height:38px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.vpage .vacts>button:hover,.vpage .vacts>details>summary:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:700px){.vpage .wrap{padding:12px 14px 8px}.vpage .vds-mod{width:40px;height:40px;border-radius:10px}.vpage h1,.vpage #vacTitulo{font-size:21px}.vpage .vacts>button,.vpage .vacts>.tvmenu>button,.vpage .vacts>details>summary{height:34px;padding:0 10px}}

/* --- 6 · navegação interna do módulo: texto azul e linha de 3 px no item ativo --- */
nav.vtabs{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:none}
nav.vtabs .wrap{max-width:none;margin:0;padding-inline:16px}
nav.vtabs .tabs>button,nav.vtabs .tabs>.ngrp>.tab,nav.vtabs .tab{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;min-height:46px;padding:0 13px;color:var(--muted)}
nav.vtabs .tabs>button:hover,nav.vtabs .tab:hover{color:var(--ink)}
nav.vtabs .tabs>button.on,nav.vtabs .tabs>button[aria-selected="true"],nav.vtabs .tab.on,nav.vtabs .tab[aria-current="page"]{color:var(--accent);border-bottom:3px solid var(--accent)}
main.wrap,.wrap{max-width:1680px}
main.wrap{padding-top:16px;padding-inline:20px}
@media (max-width:700px){main.wrap{padding-inline:12px}}

/* --- 7 · componentes comuns: seção numerada, cartões, botões, tabelas, pílulas --- */
h1,h2,h3,h4{font-family:var(--f-body)}
.vk-sec{align-items:center;margin:24px 0 12px}
.vk-sec b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 5px;border-radius:6px;background:var(--info-fill);color:var(--on-fill,#fff);font-size:12px;font-weight:700;letter-spacing:0}
.vk-sec h3{font-size:18px;color:var(--ink)}
.vk-card,.vk-dc,.vk-grp,.card,.kpi{border-color:var(--line);border-radius:12px}
.card,.vk-card,.kpi{box-shadow:var(--sh)}
.vk-dc,.card-interactive{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.vk-dc:not([disabled]):hover,.card-interactive:hover{transform:translateY(-1px);border-color:#AFCBE2;box-shadow:var(--sh-hover)}
.vk-dc:focus-visible,.card-interactive:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}
.vk-bar i{background:var(--info-fill)}.vk-bar i.ok{background:var(--ok-fill)}.vk-bar i.crit{background:var(--crit-fill)}
.card h2,.card h3,.kpi .l,.vk-estilo .card>h3{font-family:var(--f-body);letter-spacing:0}
table th{font-family:var(--f-body)}
.vds-tb th,table.t th,table.tb th,.tbl th{background:var(--surface-3);color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.02em}
button,input,select,textarea{font-family:var(--f-body)}
:focus-visible{outline-color:var(--accent)}

/* --- 8 · grade reorganizável de gráficos (vacGrade no kit_ds.js): largura inteira, metade ou um terço; ordem por arrastar ou setas --- */

/* operações (idempotentes; reaplicadas sobre a versão mais nova da base):
   {k:'os',it}                 cria a OS (se o id não existe) e o evento de criação
   {k:'osc',ac,f,ev}           muda campos de uma OS; ev = evento do histórico (status…)
   {k:'apont',ac,it}           apontamento na OS
   {k:'tag',it}                cria ou muda a parte fixa de uma TAG (código, equipamento, propósito); vigências só por 'tagvig'
   {k:'tagvig',cod,vig}        acrescenta uma vigência à TAG (regra 3: vigência gravada é imutável)
   {k:'tagdes',cod,de,motivo}  desativa uma vigência (vai para vigenciasDesativadas)
   {k:'pad',it}                padrão AM/TPM (estrutura; o conteúdo vem da manutenção)
   {k:'anom',it}               anomalia registrada (vira OS pelo botão) */
function applyOp(D,op){const ev=x=>{if(!D.eventos.some(e=>e.id===op.id))D.eventos.push({id:op.id,em:op.em,por:op.por,...x})};const up=(L,it,k='id')=>{const i=L.findIndex(x=>x[k]===it[k]);if(i>=0)L[i]={...L[i],...clone(it)};else L.push(clone(it))};
 if(op.k==='os'){if(!D.os.some(o=>o.id===op.it.id)){D.os.push(clone(op.it));ev({os:op.it.id,tipo:'criação',para:op.it.status})}}
 else if(op.k==='osc'){const o=D.os.find(x=>x.id===op.ac);if(!o)return D;for(const[k,v]of Object.entries(op.f))o[k]=v;o.atualizadaEm=op.em;if(op.ev)ev({os:op.ac,...op.ev})}
 else if(op.k==='apont'){const o=D.os.find(x=>x.id===op.ac);if(!o)return D;const L=o.apontamentos||(o.apontamentos=[]);if(!L.some(x=>x.id===op.it.id))L.push(clone(op.it))}
 else if(op.k==='tag'){const t=D.tags.find(x=>x.codigo===op.it.codigo);if(t)Object.assign(t,clone(op.it));else D.tags.push({vigencias:[],vigenciasDesativadas:[],...clone(op.it)})}
 else if(op.k==='tagvig'){const t=D.tags.find(x=>x.codigo===op.cod);if(t&&!t.vigencias.some(v=>v.id===op.vig.id))t.vigencias.push(clone(op.vig))}
 else if(op.k==='tagdes'){const t=D.tags.find(x=>x.codigo===op.cod);if(!t)return D;const i=t.vigencias.findIndex(v=>v.id===op.vid);if(i>=0){const v=t.vigencias.splice(i,1)[0];(t.vigenciasDesativadas||(t.vigenciasDesativadas=[])).push({...v,desativadaEm:op.em,desativadaPor:op.por,motivo:op.motivo||''})}}
 else if(op.k==='pad')up(D.padroes,op.it);
 else if(op.k==='anom')up(D.anomalias,op.it);
 return D}
