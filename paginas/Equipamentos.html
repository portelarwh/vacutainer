   {k:'tagdes',cod,de,motivo}  desativa uma vigência (vai para vigenciasDesativadas)

/* ---------- rotas: #aba=, #eq=, #os=, #novaOS=<json> (do Paradas) ---------- */
function rota(){let h=location.hash.slice(1);if(!h)return;let k,v,vr='';const i=h.indexOf('=');if(i<0){k=h;v=''}else{k=h.slice(0,i);v=vr=h.slice(i+1)}try{v=decodeURIComponent(v)}catch(e){}
 const dec=x=>{try{return decodeURIComponent(x)}catch(e){return x}};
 if(k==='teste')return enterTest();
 if(k==='aba'){const j=vr.indexOf('&eq='),a=dec(j<0?vr:vr.slice(0,j)),q=j<0?'':dec(vr.slice(j+4));if(ABAS.some(x=>x[0]===a)){App.tab=a;if(q)App.eq=q;return render()}}
 if((k==='eq'||k==='equipamento')&&v){App.tab='equip';App.eq=v;history.replaceState(history.state,'','#aba=equip');return render()}
 if(k==='os'&&v){App.tab='os';App.osSel=v;App.f.st='';return render()}
 if(k==='novaOS'){let p={};try{p=v?JSON.parse(v):{}}catch(e){toast('Link de OS inválido',1)}if(!p||typeof p!=='object')p={};if(p.origem&&p.origem.link&&!vacLinkSeguro(p.origem.link)){delete p.origem.link;toast('O link de origem recebido não é um endereço seguro e foi descartado.',1)}history.replaceState(history.state,'','#aba=os');App.tab='os';render();formOS(null,p)}}
window.addEventListener('hashchange',rota);
PAGE.busca=q=>{const k=norm(q),R=[];for(const o of Store.data.os)if(norm(o.id+' '+o.titulo+' '+o.equipamento+' '+(o.sapNota||'')).includes(k))R.push({tipo:'OS',txt:o.titulo,sub:`${o.id} · ${o.equipamento} · ${osNome(o.status)}`,go:()=>{App.osSel=o.id;App.f.st='';ir('os')}});
 for(const t of Store.data.tags)if(norm(t.codigo+' '+t.proposito+' '+((vigDe(t)||{}).nomeMes||'')).includes(k))R.push({tipo:'TAG',txt:t.codigo,sub:t.proposito,go:()=>{App.eq=t.equipamento;ir('equip')}});return R.slice(0,20)};
