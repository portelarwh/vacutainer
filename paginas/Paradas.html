<title>Paradas · Linha Vacutainer</title>
<!--
  PARADAS · Análise de falhas e paradas de máquina · Sistemas da Linha Vacutainer
  Arquivo: Paradas.html  ·  Base: paradas-base.json  ·  Backups: 00. Backups/Paradas/
  Contratos: claude/paginas-novas.md · claude/kit-cabecalho-e-backups.md · claude/cadastro-base-contrato.md
             claude/portal-e-padrao-comum.md · claude/paradas-arquitetura.md
  Regras:
  - Só grava paradas-base.json (e os backups dele). Lê vacutainer-cadastros.json e oee-vacutainer-base.json (só o exports).
  - Cada alteração vira uma operação numa fila; a gravação relê a base, reaplica a fila sobre a versão nova,
    faz o backup diário, grava rev+1 com revId novo e relê para conferir. Alteração feita durante a gravação nunca é dada como salva.
  - Códigos de parada: chave = 3 letras (imutável); número de 3 dígitos para o operador (centena = grupo).
    Classe "porDuracao": < limite (10 min) = microparada (P); >= limite = parada operacional (D). Grupo 8 = quebra.
-->

<style>

:root{--vs-bg:#15222f;--vs-ink:#ffffff;--vs-mut:#aab8c6;--vs-line:rgba(255,255,255,.16);--vs-hl:#86b6e6;--sh:0 1px 2px rgba(16,24,40,.06),0 2px 6px rgba(16,24,40,.06)}

.vk-list li .v{font-weight:700;font-variant-numeric:tabular-nums}.vk-list li .sp{flex:1}
.vk-side h4{margin:0 0 6px;font-family:var(--f-body,system-ui,sans-serif);font-size:14px;font-weight:700;text-transform:none;letter-spacing:0}
.vk-dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.vk-dg{grid-template-columns:1fr}}
.vk-dc{padding:14px 18px;display:grid;gap:4px;text-align:left;cursor:pointer;border:1px solid var(--line,#d8e1ec);border-radius:12px;background:var(--surface,var(--card,#fff));color:inherit;font:inherit;min-height:44px}
.vk-dc:hover{border-color:var(--accent,#1565a8)}.vk-dc:focus-visible,.vk-gh:focus-visible{outline:2px solid var(--accent,#1565a8);outline-offset:2px}
.vk-dc .l{font-size:13px;color:var(--muted,#64748b)}.vk-dc .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.vk-dc .s{font-size:13px;color:var(--muted,#64748b)}
.vk-dc[disabled]{cursor:default}.vk-dc[disabled]:hover{border-color:var(--line,#d8e1ec)}
.vk-grp{border:1px solid var(--line,#d8e1ec);border-radius:12px;background:var(--surface-3,var(--bg,transparent));margin:0 0 14px}
.vk-gh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;cursor:pointer;text-align:left;color:inherit;font:inherit;min-height:48px;border-radius:12px}
.vk-gh .seta{width:18px;color:var(--muted,#64748b)}.vk-gh .t{font-family:var(--f-body,system-ui,sans-serif);font-size:16px;font-weight:700}.vk-gh .q{color:var(--muted,#64748b);font-size:13px}.vk-gh .n{margin-left:auto;color:var(--muted,#64748b);font-size:12.5px;white-space:nowrap}
.vk-gb{padding:0 14px 14px}.vk-grp.fechado .vk-gb{display:none}
.vk-est{margin:-2px 0 8px;padding:6px 10px;border-radius:8px;background:var(--warn-bg,rgba(143,90,0,.12));color:var(--warn,#8f5a00);font-size:12.5px;font-weight:600}
@media (max-width:620px){.vk-big{font-size:32px}}
@media print{.vk-grp.fechado .vk-gb{display:block!important}.vk-gh .seta{display:none!important}}
/* estilo do padrão nas demais abas da página que liga a classe vk-estilo no contêiner: cartões de 12 px, títulos e rótulos sem caixa alta */
.vk-estilo .card{border-radius:12px}
.vk-estilo .card>h3,.vk-estilo .card>header h3,.vk-estilo .card h3:first-child{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:17px;font-weight:700}
.vk-estilo .kpi{border-radius:12px}
.vk-estilo .kpi .l{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
/* filtros: no celular, os marcados com vk-opt ficam em "Mais filtros" (botão .vk-mais) */
.vk-mais{display:none}
@media (max-width:700px){.vk-mais{display:inline-flex}.filters:not(.vk-aberto) .vk-opt{display:none!important}}
.vk-estilo .card .sh h2{font-family:var(--f-body,system-ui,sans-serif);text-transform:none;letter-spacing:0;font-size:17px;font-weight:700}
a.vk-dc,a.vk-dc:hover{text-decoration:none;color:inherit}
/* Gráficos (docs/graficos-padrao.md): linha "Valores em <unidade>" acima do gráfico cujo eixo não traz a unidade */
.c-un{margin:0 0 2px;font-size:11.5px;color:var(--muted,#64748b)}.c-un b{font-weight:600;color:var(--ink,inherit)}

function vazio(){return{schema:'vac-paradas',schemaVersion:1,rev:0,revBy:'',revAt:'',revId:'',appVersion:APP_VERSION,
 eventos:[],tecnico:{},validacao:{},acoes:[],importacoes:[],

/* operação (sempre idempotente; é reaplicada sobre a versão mais nova da base):
   {k:'list',c,items}        inclui/substitui por id numa lista (eventos, acoes, importacoes)
   {k:'del',c,ids}           tira itens de uma lista
   {k:'mapf',c,id,f}         junta campos num mapa (tecnico, validacao); f[campo]=null apaga o campo
   {k:'mapdel',c,ids}        apaga chaves de um mapa
   {k:'cfg',key,v}           config[key]=v
   {k:'wipe',what}           limpa eventos/técnico/validação (e ações se what='tudo')
   aud: texto da auditoria */
function applyOp(D,op){
 if(op.k==='list'){const L=D[op.c]||(D[op.c]=[]);const ix=new Map(L.map((x,i)=>[x.id,i]));for(const it of op.items){if(ix.has(it.id))L[ix.get(it.id)]=it;else{ix.set(it.id,L.length);L.push(it)}}}
 else if(op.k==='del'){const s=new Set(op.ids);D[op.c]=(D[op.c]||[]).filter(x=>!s.has(x.id))}
 else if(op.k==='mapf'){const M=D[op.c]||(D[op.c]={});const o=M[op.id]||{};for(const[k,v]of Object.entries(op.f)){if(v==null||v==='')delete o[k];else o[k]=v}if(Object.keys(o).length)M[op.id]=o;else delete M[op.id]}
 else if(op.k==='mapdel'){const M=D[op.c]||{};for(const id of op.ids)delete M[id]}
 else if(op.k==='cfg'){D.config=D.config||{};if(op.v==null)delete D.config[op.key];else D.config[op.key]=op.v}
 else if(op.k==='wipe'){D.eventos=[];D.tecnico={};D.validacao={};D.importacoes=[];if(op.what==='tudo')D.acoes=[]}
 return D}
function completar(D){const V=vazio();for(const k of Object.keys(V))if(D[k]==null)D[k]=V[k];for(const k of Object.keys(V.config))if(!(k in D.config))D.config[k]=V.config[k];return D}
function validarBase(D){const e=[];if(!D||typeof D!=='object')return['não é um objeto'];
 for(const k of['eventos','acoes','importacoes'])if(D[k]!=null&&!Array.isArray(D[k]))e.push(k+' não é lista');
 for(const k of['tecnico','validacao','config'])if(D[k]!=null&&(typeof D[k]!=='object'||Array.isArray(D[k])))e.push(k+' não é objeto');
 (D.eventos||[]).slice(0,5000).forEach((x,i)=>{if(!x.id)e.push('evento '+i+' sem id');if(x.dia&&!/^\d{4}-\d{2}-\d{2}$/.test(x.dia))e.push('evento '+x.id+' com data inválida');if(x.minutos!=null&&!(x.minutos>=0))e.push('evento '+x.id+' com minutos inválidos')});
 return e.slice(0,10)}

/* fila técnica: o que falta a camada técnica completar */
function filaTecnica(L){const D=Store.data,out=[];for(const e of L){const c=classe(e),t=D.tecnico[e.id]||{},tp=trocou(e),cod=codigoEf(e);const falta=[];let tipo=null;
  if(c==='quebra'){if(tp==null)falta.push('confirmar troca de peça');if(!(t.componente||e.peca))falta.push('componente');if(!t.modo)falta.push('modo de falha');if(!t.acao)falta.push('ação');if(tp===false)tipo='reclass'}

 for(const g of G){const r30=g.ev.filter(e=>e.dia>=lim);const meses=[...new Set(g.ev.map(e=>e.dia.slice(0,7)))].sort();let seq=1,best=1;for(let i=1;i<meses.length;i++){const[a,b]=[meses[i-1],meses[i]];const nx=addDays(a+'-28',5).slice(0,7);seq=nx===b?seq+1:1;best=Math.max(best,seq)}

   acao:D.acoes.find(a=>a.chave===g.k&&a.status!=='concluída')})}}

      '<div class="vl-a"><button type="button" class="vl-btn p" id="vlOk">Trocar senha</button><button type="button" class="vl-lk" id="vlVolta">Voltar</button></div>');
    ligaPin('vlP0', null)[0].focus(); ligaPin('vlP1', null); ligaPin('vlP2', null);
    el.querySelector('#vlVolta').onclick = passoConta;
    el.querySelector('#vlOk').onclick = async () => {
      if (u.senha && u.senha.hash) { if (bloqueio(u.codigo)) return msg('Bloqueado por senhas erradas. Tente em alguns minutos.', 'e'); if (!(await confere(u, pin('vlP0')))) { errou(u.codigo); limpaPin('vlP0'); return msg('A senha atual não confere.', 'e'); } }

  /* ---- ciclo: abre quando falta sessão; fecha sozinho se outra aba entrou ---- */
  function checar() {
    if (el) { if (dispensado() || (sessao() && !modo.trocar)) fechar(); else if (el.dataset.passo === 'semcad' && cad()) passoId(); return; }

/* ----- kit v2.1 · vacLayout: padrão da Visão Geral (11/11/2026; igual em todas as páginas; não editar só numa) -----
   Peças comuns para montar a tela inicial de cada página na mesma ordem de leitura da Produção (2.4.49):
   sec(n, título, subtítulo) · grupo(chave, nome, pergunta, conteúdo) · estado(classe, texto) · ligar(raiz, página).
   Os estilos estão no kit_visual.css (vk-*). Grupos recolhidos ficam em localStorage vac.grupos.<página> ({chave: 1}); na impressão saem abertos.
   Só apresentação: a página continua calculando os próprios números. */
const vacLayout = (() => {
  const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const F = p => { try { const x = JSON.parse(localStorage.getItem('vac.grupos.' + p) || '{}'); return x && typeof x === 'object' ? x : {}; } catch (x) { return {}; } };
  const G = (p, f) => { try { localStorage.setItem('vac.grupos.' + p, JSON.stringify(f)); } catch (x) { } };
  const sec = (n, t, s) => `<div class="vk-sec"><b>${e(n)}</b><h3>${e(t)}</h3>${s ? `<span>${e(s)}</span>` : ''}</div>`;
  const estado = (c, t) => `<span class="vk-st ${e(c)}">${e(t)}</span>`;
  /* html do grupo; o corpo é colocado pela página (string) ou depois, movendo nós para .vk-gb */
  const grupo = (p, k, nome, q, corpo, n) => { const fe = !!F(p)[k], id = 'vkg-' + p + '-' + k;
    return `<section class="vk-grp${fe ? ' fechado' : ''}" data-vk-grupo="${e(k)}"><button type="button" class="vk-gh" aria-expanded="${!fe}" aria-controls="${id}"><span class="seta" aria-hidden="true">${fe ? '▸' : '▾'}</span><span><span class="t">${e(k)} · ${e(nome)}</span><br><span class="q">${e(q || '')}</span></span>${n != null ? `<span class="n">${e(n)}</span>` : ''}</button><div class="vk-gb" id="${id}">${corpo || ''}</div></section>`; };
  function ligar(root, p) {
    (root || document).querySelectorAll('.vk-grp').forEach(g => { const b = g.querySelector(':scope > .vk-gh'); if (!b || b._vk) return; b._vk = 1;
      b.addEventListener('click', () => { const k = g.dataset.vkGrupo, f = F(p), fe = !g.classList.contains('fechado'); g.classList.toggle('fechado', fe); b.setAttribute('aria-expanded', !fe);
        const s = b.querySelector('.seta'); if (s) s.textContent = fe ? '▸' : '▾'; if (fe) f[k] = 1; else delete f[k]; G(p, f); window.dispatchEvent(new CustomEvent('vac:grupo', { detail: { pagina: p, grupo: k, aberto: !fe } })); }); });
  }
  const fechado = (p, k) => !!F(p)[k];
  return { sec, estado, grupo, ligar, fechado };
})();
/* "Mais filtros" no celular: botão .vk-mais dentro de .filters abre e fecha os campos .vk-opt (vacLayout, 11/11/2026) */
document.addEventListener('click', ev => { const b = ev.target.closest('.vk-mais'); if (!b) return; const f = b.closest('.filters'); if (!f) return; const o = f.classList.toggle('vk-aberto'); b.setAttribute('aria-expanded', o); b.textContent = o ? 'Menos filtros ▴' : 'Mais filtros ▾'; });

</script>
