# Configuração deste projeto; não altera permissões, cobrança ou sandbox do usuário.
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"

[agents]
# Alias documentado, compatível com clientes anteriores.
max_threads = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
