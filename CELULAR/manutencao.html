var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();

    return qrcode;

<script>
'use strict';
/* Manutenção 0.1 (MAN-01, 22/11/2026) · app de celular do técnico: registra o atendimento corretivo (equipamento, modo de falha, se
   parou a linha, início e fim, sintoma, causa, ação, peças e situação) e envia para a plataforma por QR (webcam) ou arquivo, que vira
   OS em Equipamentos › Ordens de serviço. Gerado pela Administração › Apps de celular com o cadastro embutido (CFG_EMB): equipamentos,
   modos de falha e pessoas (só ID, nome e turno). Os dados ficam só no celular; nada sai sozinho. */
const FONTE='<!doctype html>\n'+document.documentElement.outerHTML;
const CFG_EMB=/*CFG*/null/*CFG*/;
const VERSAO='0.2';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const agoraLocal=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const brh=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11,16):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const LS={get(k,d){try{const v=localStorage.getItem('mm.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mm.'+k,JSON.stringify(v))}catch(e){toast('Memória do celular cheia: envie e apague atendimentos antigos')}}};
/* configuração: a embutida vale quando é mais nova que a do aparelho; sem ela, dados fictícios (TESTE) */
const CFG0={linha:'Linha (TESTE)',maqs:[{c:'EQ01',n:'Máquina A (TESTE)'},{c:'EQ02',n:'Máquina B (TESTE)'}],modos:[{c:'MF01',n:'Desgaste'},{c:'MF02',n:'Ruptura'},{c:'MF03',n:'Folga'}],pessoas:[],rev:0};
let CFG=(()=>{const l=LS.get('cfg',null);if(CFG_EMB&&(!l||(l.rev||0)<(CFG_EMB.rev||0))){LS.set('cfg',CFG_EMB);return JSON.parse(JSON.stringify(CFG_EMB))}return l||JSON.parse(JSON.stringify(CFG0))})();
let AT=LS.get('atend',[]);const salvar=()=>LS.set('atend',AT);
const maq=c=>(CFG.maqs||[]).find(m=>m.c===c),modo=c=>(CFG.modos||[]).find(m=>m.c===c);
function novo(){return{id:uid(),tec:LS.get('tec',''),tecId:LS.get('tecId',''),eq:'',mf:'',mfTxt:'',parou:false,ini:agoraLocal(),fim:'',sint:'',causa:'',acao:'',pecas:'',sit:'concluida',obs:'',criadoEm:new Date().toISOString(),enviado:false}}
const durMin=a=>a.ini&&a.fim?Math.round((new Date(a.fim)-new Date(a.ini))/60000):null;
/* ---------- telas ---------- */
const topo=(t,sub,dir='')=>`<header class="top">${dir}<h1>${esc(t)}${sub?`<div class="sub">${esc(sub)}</div>`:''}</h1><button class="ib" id="tema" aria-label="Tema">◐</button></header>`;
function comum(){const t=$('#tema');if(t)t.onclick=()=>{const c=document.documentElement.dataset.tema==='claro'?'':'claro';document.documentElement.dataset.tema=c;LS.set('tema',c)}}
function ir(r){location.hash=r}
window.addEventListener('hashchange',render);
function render(){const [rota,arg]=(location.hash||'#inicio').slice(1).split('/');const a=$('#app');
 a.innerHTML=rota==='at'?vAt(arg):rota==='env'?vEnv(arg):vInicio();({at:ligAt,env:ligEnv}[rota]||ligInicio)(arg);scrollTo(0,0)}
function vInicio(){const L=AT.slice().sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));
 return topo('Manutenção',CFG.linha)+`<main><button class="btn pri blk" id="novo">+ Novo atendimento</button>${window.VAC_LINHA?'<button class="btn blk" id="trocaMod">⇄ Trocar de módulo (Operação / Manutenção)</button>':''}
  <div class="card"><h2>Atendimentos</h2>${L.length?L.map(a=>{const m=maq(a.eq);return`<button class="it" data-at="${a.id}"><div><b>${esc(m?m.n:a.eq||'sem equipamento')}</b><span>${brh(a.ini)} · ${esc((modo(a.mf)||{}).n||a.mfTxt||'—')} · ${a.sit==='concluida'?'concluído':'pendente'}${a.enviado?' · enviado':''}</span></div><i>›</i></button>`}).join(''):'<p class="small muted">Nenhum atendimento ainda.</p>'}</div>
  <p class="small muted" style="text-align:center">Os dados ficam neste celular e vão para a plataforma por QR ou arquivo. · versão ${VERSAO}${CFG.fonte&&CFG.fonte.cadRev!=null?' · cadastro rev '+esc(CFG.fonte.cadRev):''}</p></main>`}
function ligInicio(){comum();const tm=$('#trocaMod');if(tm)tm.onclick=()=>window.VAC_LINHA.trocar();$('#novo').onclick=()=>{const a=novo();AT.push(a);salvar();ir('at/'+a.id)};$$('[data-at]').forEach(b=>b.onclick=()=>ir('at/'+b.dataset.at))}
function vAt(id){const a=AT.find(x=>x.id===id);if(!a)return topo('Atendimento')+'<main><div class="card">Não encontrado.</div></main>';const P=CFG.pessoas||[];
 return topo('Atendimento',brh(a.ini),'<a class="ib" href="#inicio" aria-label="Voltar" style="text-decoration:none">‹</a>')+`<main>
 <div class="card"><h2>Quem e onde</h2><div style="display:grid;gap:10px">
  ${P.length?`<label class="f">Técnico<select class="in" id="tec"><option value="">— escolha seu nome —</option>${P.map(x=>`<option value="${esc(x.id)}"${String(x.id)===String(a.tecId)?' selected':''}>${esc(x.n)}</option>`).join('')}</select></label>`:`<label class="f">Técnico<input class="in" id="tec" value="${esc(a.tec)}" placeholder="Seu nome"></label>`}
  <label class="f">Equipamento<select class="in" id="eq"><option value="">— escolha —</option>${(CFG.maqs||[]).map(m=>`<option value="${esc(m.c)}"${m.c===a.eq?' selected':''}>${esc(m.c+' · '+m.n)}</option>`).join('')}</select></label>
  <label class="f">Modo de falha<select class="in" id="mf"><option value="">— escolha —</option>${(CFG.modos||[]).map(m=>`<option value="${esc(m.c)}"${m.c===a.mf?' selected':''}>${esc(m.n)}</option>`).join('')}<option value="_"${a.mf==='_'?' selected':''}>Outro (escrever)</option></select></label>
  ${a.mf==='_'?`<label class="f">Qual<input class="in" id="mfTxt" value="${esc(a.mfTxt)}"></label>`:''}
  <label class="f" style="grid-template-columns:auto 1fr;align-items:center;gap:10px"><input type="checkbox" id="parou" ${a.parou?'checked':''} style="width:24px;height:24px"> Parou a linha</label>
  <div class="g2"><label class="f">Início<input class="in" type="datetime-local" id="ini" value="${esc(a.ini)}"></label><label class="f">Fim<input class="in" type="datetime-local" id="fim" value="${esc(a.fim)}"></label></div>
  <div class="small muted">Duração: <b>${durMin(a)==null?'—':durMin(a)+' min'}</b></div></div></div>
 <div class="card"><h2>O que aconteceu</h2><div style="display:grid;gap:10px">
  <label class="f">Sintoma (o que foi visto)<textarea class="in" id="sint" rows="2">${esc(a.sint)}</textarea></label>
  <label class="f">Causa<textarea class="in" id="causa" rows="2">${esc(a.causa)}</textarea></label>
  <label class="f">Ação feita<textarea class="in" id="acao" rows="3">${esc(a.acao)}</textarea></label>
  <label class="f">Peças trocadas (uma por linha)<textarea class="in" id="pecas" rows="2">${esc(a.pecas)}</textarea></label>
  <div class="seg"><button data-sit="concluida" class="${a.sit==='concluida'?'on':''}">Concluído</button><button data-sit="pendente" class="${a.sit==='pendente'?'on':''}">Pendente</button></div>
  <label class="f">Observação<textarea class="in" id="obs" rows="2">${esc(a.obs)}</textarea></label></div></div>
 <button class="btn pri blk" id="env">Enviar para a plataforma (QR ou arquivo)</button>
 <button class="btn blk" id="del" style="color:var(--crit)">Apagar este atendimento</button></main>`}
function ligAt(id){comum();const a=AT.find(x=>x.id===id);if(!a)return;const sv=()=>salvar(),rr=()=>{salvar();const y=scrollY;render();scrollTo(0,y)};
 const t=$('#tec');if(t.tagName==='SELECT')t.onchange=()=>{const x=(CFG.pessoas||[]).find(p=>String(p.id)===t.value);a.tecId=x?String(x.id):'';a.tec=x?x.n:'';LS.set('tec',a.tec);LS.set('tecId',a.tecId);sv()};else t.oninput=()=>{a.tec=t.value;LS.set('tec',a.tec);sv()};
 $('#eq').onchange=e=>{a.eq=e.target.value;sv()};$('#mf').onchange=e=>{a.mf=e.target.value;rr()};const mt=$('#mfTxt');if(mt)mt.oninput=()=>{a.mfTxt=mt.value;sv()};
 $('#parou').onchange=e=>{a.parou=e.target.checked;sv()};$('#ini').onchange=e=>{a.ini=e.target.value;rr()};$('#fim').onchange=e=>{a.fim=e.target.value;rr()};
 for(const k of['sint','causa','acao','pecas','obs'])$('#'+k).oninput=e=>{a[k]=e.target.value;sv()};
 $$('[data-sit]').forEach(b=>b.onclick=()=>{a.sit=b.dataset.sit;rr()});
 $('#env').onclick=()=>{const f=[];if(!a.eq)f.push('equipamento');if(!a.tec)f.push('técnico');if(!(a.mf&&(a.mf!=='_'||a.mfTxt.trim())))f.push('modo de falha');if(!a.acao.trim()&&a.sit==='concluida')f.push('ação feita');if(a.fim&&a.fim<a.ini)f.push('fim depois do início');
  if(f.length)return toast('Falta: '+f.join(', '));ir('env/'+a.id)};
 $('#del').onclick=()=>{if(!confirm('Apagar este atendimento do celular?'))return;AT=AT.filter(x=>x.id!==a.id);salvar();ir('inicio')}}
/* ---------- envio: mesmo formato do Meu Turno (MT1:id:k/n:dados, compactado) ---------- */
function pacote(a){const m=maq(a.eq)||{},f=modo(a.mf)||{};return{a:'manutencao',v:1,id:a.id,eq:a.eq,eqn:m.n||'',mf:a.mf==='_'?'':a.mf,mfn:a.mf==='_'?a.mfTxt:(f.n||''),parou:!!a.parou,ini:a.ini,fim:a.fim||'',dur:durMin(a),
 sint:a.sint,causa:a.causa,acao:a.acao,pecas:a.pecas.split('\n').map(s=>s.trim()).filter(Boolean),sit:a.sit,tec:a.tec,tecId:a.tecId||'',obs:a.obs,cr:CFG.rev||0,cadRev:(CFG.fonte||{}).cadRev??null}}
async function qrPartes(obj,tam=450){const js=JSON.stringify(obj);let b64;
 try{const cs=new Blob([js]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());let bin='';for(const x of buf)bin+=String.fromCharCode(x);b64='Z'+btoa(bin)}
 catch(e){b64='J'+btoa(unescape(encodeURIComponent(js)))}
 const N=Math.max(1,Math.ceil(b64.length/tam)),id=(obj.id||uid()).replace(/[^a-z0-9]/gi,'').slice(-6);
 return Array.from({length:N},(_,k)=>`MT1:${id}:${k+1}/${N}:`+b64.slice(k*tam,(k+1)*tam))}
const qrSvg=t=>{const q=qrcode(0,'M');q.addData(t,'Byte');q.make();return q.createSvgTag({cellSize:6,margin:4,scalable:true})};
let ENV={partes:[],k:0,auto:null};
function vEnv(id){const a=AT.find(x=>x.id===id);if(!a)return topo('Enviar')+'<main><div class="card">Não encontrado.</div></main>';
 return topo('Enviar para a plataforma',(maq(a.eq)||{}).n||'',`<a class="ib" href="#at/${esc(a.id)}" aria-label="Voltar" style="text-decoration:none">‹</a>`)+`<main>
 <div class="card" style="display:grid;gap:10px;justify-items:center"><div id="qr" style="width:100%;max-width:420px;background:#fff;border-radius:12px;padding:6px"></div><b id="qrk" class="tn">preparando…</b>
  <div class="g3" style="width:100%"><button class="btn" id="qra">‹</button><button class="btn" id="qrp">Pausar</button><button class="btn" id="qrn">›</button></div>
  <div class="small muted" style="text-align:center">Na plataforma: <b>Equipamentos › Ordens de serviço › Importar do celular</b>. Aponte a tela para a webcam do computador.</div></div>
 <button class="btn blk" id="arq">Baixar arquivo do atendimento (.mm.json)</button><button class="btn blk" id="ok">Marcar como enviado</button></main>`}
async function ligEnv(id){comum();const a=AT.find(x=>x.id===id);if(!a)return;clearInterval(ENV.auto);const P=pacote(a);ENV={partes:await qrPartes(P),k:0,auto:null};
 const mostra=()=>{$('#qr').innerHTML=qrSvg(ENV.partes[ENV.k]);$('#qrk').textContent=ENV.partes.length>1?`Parte ${ENV.k+1} de ${ENV.partes.length}`:'Parte única'};const passo=d=>{ENV.k=(ENV.k+d+ENV.partes.length)%ENV.partes.length;mostra()};mostra();
 if(ENV.partes.length>1)ENV.auto=setInterval(()=>{if(!$('#qr')){clearInterval(ENV.auto);return}passo(1)},1600);else $('#qrp').disabled=true;
 $('#qra').onclick=()=>passo(-1);$('#qrn').onclick=()=>passo(1);$('#qrp').onclick=()=>{if(ENV.auto){clearInterval(ENV.auto);ENV.auto=null;$('#qrp').textContent='Continuar'}else if(ENV.partes.length>1){ENV.auto=setInterval(()=>passo(1),1600);$('#qrp').textContent='Pausar'}};
 $('#arq').onclick=()=>{const b=new Blob([JSON.stringify(P,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=`atendimento-${a.ini.slice(0,10)}-${a.eq}.mm.json`;l.click();toast('Arquivo salvo')};
 $('#ok').onclick=()=>{a.enviado=true;salvar();toast('Marcado como enviado');ir('inicio')}}
if(LS.get('tema',''))document.documentElement.dataset.tema=LS.get('tema','');
render();
</script>
