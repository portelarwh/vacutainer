<title>Meu Turno · Linha</title>
<!--
  Meu Turno 0.1 (20/11/2026; pasta CELULAR, fora da Plataforma.html) · app de celular para o operador lançar o turno.
  Independente da plataforma (os celulares não acessam o servidor): os dados ficam no próprio aparelho (localStorage + IndexedDB
  para fotos) e saem por WhatsApp ou PDF. Mesma lógica da plataforma: intervalos do turno alinhados à hora cheia, sobra final de até
  45 min (configurável) junta ao intervalo anterior, como no quadro da linha (na plataforma: tailMergeMax), plano do intervalo = meta/h × minutos, unidade "mil", gel teórico = tubos × g/tubo.
  Configuração inicial (turnos, catálogos, máquinas, motivos) editável no app e compartilhável como arquivo .json.
-->
<style>
/* ===== tokens (escuro por padrão; claro opcional) ===== */
:root{--bg:#0f1418;--sf:#161d23;--sf2:#1c252c;--ln:#27323b;--ink:#e8edf1;--mut:#93a1ad;--ac:#4c8bf5;--ac2:#2f6fe0;--ok:#3fb27f;--warn:#e0a43a;--crit:#e5534b;--r:14px;--f:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:root[data-tema="claro"]{--bg:#f3f5f7;--sf:#fff;--sf2:#f0f3f6;--ln:#d9e0e6;--ink:#14202b;--mut:#5b6b78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.top h1{font-size:18px;margin:0;font-weight:750;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .sub{font-size:12.5px;color:var(--mut);font-weight:500}
a.ib,.ib{color:var(--ink);text-decoration:none}.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
main{padding:14px 16px;display:grid;gap:14px;max-width:640px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
label.f{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:600}
.in,select.in,textarea.in{width:100%;min-height:48px;border-radius:11px;border:1px solid var(--ln);background:var(--sf2);padding:10px 12px;font-size:17px;color:var(--ink);outline:none}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.g2>*,.g3>*{min-width:0}input[type=date].in{min-width:0;-webkit-appearance:none;appearance:none}html,body{overflow-x:hidden}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{min-height:50px;border-radius:13px;border:1px solid var(--ln);background:var(--sf2);font-weight:700;font-size:16px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140d}.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}.btn.blk{width:100%}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);font-weight:650;font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mut)}.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.muted{color:var(--mut)}.small{font-size:13px}.tn{font-variant-numeric:tabular-nums}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.critc{color:var(--crit)}
/* início */
.hero{display:grid;gap:12px}
.big{min-height:120px;border-radius:20px;border:0;background:linear-gradient(135deg,#2f6fe0,#1f4fb0);color:#fff;text-align:left;padding:18px 20px;display:grid;gap:4px;box-shadow:0 8px 24px rgba(31,79,176,.35)}
.big b{font-size:24px}.big span{opacity:.85;font-size:14px}
.tile{min-height:76px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);text-align:left;padding:14px 16px;display:flex;align-items:center;gap:14px}
.tile i{font-style:normal;width:44px;height:44px;border-radius:12px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:22px}.tile b{display:block;font-size:17px}.tile span{font-size:13px;color:var(--mut)}
/* hora a hora */
.slot{border:1px solid var(--ln);border-radius:13px;padding:10px 12px;display:grid;gap:8px;background:var(--sf2)}
.slot.agora{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 35%,transparent)}
.slot .h{display:flex;align-items:center;gap:8px}.slot .h b{font-size:16px}.slot .h .pl{margin-left:auto;font-size:13px;color:var(--mut)}
.slot .r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.slot .in{font-size:22px;font-weight:750;text-align:center;min-height:52px}
.acc{font-size:12.5px;color:var(--mut);text-align:right;line-height:1.3}.acc b{font-size:15px}
.pars{display:grid;gap:6px}.par{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 8px}.par .m{font-weight:800;color:var(--warn);min-width:44px}.par .x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:18px}
.addp{border:1px dashed var(--ln);background:none;border-radius:10px;min-height:40px;color:var(--mut);font-weight:650}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.bar .k{flex:1;display:grid;font-size:12.5px;color:var(--mut)}.bar .k b{font-size:18px;color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs[hidden]{display:none}nav.tabs a{min-height:62px;display:grid;place-items:center;align-content:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11.5px;font-weight:650}nav.tabs a i{font-style:normal;font-size:21px}nav.tabs a.on{color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kp div{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.kp small{display:block;color:var(--mut);font-size:12px;font-weight:650}.kp b{font-size:22px}
.list{display:grid;gap:10px}.it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:12px;text-align:left;width:100%}
.dot{width:12px;height:12px;border-radius:50%}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:750;border:1px solid currentColor}
.pbar{height:10px;border-radius:99px;background:var(--sf2);overflow:hidden;border:1px solid var(--ln)}.pbar i{display:block;height:100%;background:var(--ac)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}.sheet{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;border-top:1px solid var(--ln)}
.sheet h3{margin:0;font-size:18px}.grab{width:42px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0b1014;color:#fff;border:1px solid var(--ln);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%}
.photo{width:100%;border-radius:12px;border:1px solid var(--ln);display:block}
.res{font-size:30px;font-weight:800}.res small{font-size:15px;color:var(--mut);font-weight:600}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 50%,var(--ln));background:color-mix(in srgb,var(--warn) 10%,var(--sf));border-radius:12px;padding:10px 12px;font-size:14px}
pre.wa{white-space:pre-wrap;background:#0b141a;color:#e9edef;border-radius:12px;padding:12px;font:14px/1.45 var(--f);margin:0;border:1px solid #1f2c33}
/* relatório A4 (PDF pelo "Salvar como PDF" do navegador) */
#print{display:none}
@media print{@page{size:A4;margin:12mm}body{background:#fff;color:#111;padding:0}body>*:not(#print){display:none!important}#print{display:block}}
.rp{font:10pt/1.35 Arial,sans-serif;color:#111}.rp h1{font-size:16pt;margin:0}.rp .cab{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1f4fb0;padding-bottom:6px;margin-bottom:8px}
.rp .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.rp .kpi div{border:1px solid #ccd;border-radius:6px;padding:5px 8px}.rp .kpi small{display:block;font-size:7.5pt;color:#556;text-transform:uppercase;font-weight:700}.rp .kpi b{font-size:13pt}
.rp table{width:100%;border-collapse:collapse;margin:6px 0}.rp th,.rp td{border:1px solid #ccd;padding:3px 5px;text-align:left;font-size:9pt}.rp th{background:#eef2f8;font-size:8pt;text-transform:uppercase}.rp td.n{text-align:right;font-variant-numeric:tabular-nums}
.rp h2{font-size:10.5pt;margin:10px 0 2px;color:#1f4fb0;text-transform:uppercase}.rp .neg{color:#c62828;font-weight:700}.rp .pos{color:#197a4a;font-weight:700}.rp img{max-width:100%;max-height:120mm;border:1px solid #ccd;border-radius:4px}

<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="print"></div>
<script>
'use strict';
/* 0.2 · "Gerar app com esta configuração": o próprio arquivo, lido aqui antes de qualquer desenho, é copiado com a configuração
   do responsável embutida em CFG_EMB. O cadastro real nunca passa pelo repositório (que só tem dados fictícios). */
const FONTE='<!doctype html>\n'+document.documentElement.outerHTML;
const CFG_EMB=/*CFG*/null/*CFG*/;
/* =========================== utilitários =========================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hojeISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const br=iso=>iso?iso.split('-').reverse().join('/'):'—';
const brc=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7):'—';
const nf=(v,d=0)=>v==null||!isFinite(v)?'—':(+v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const min2hm=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+':'+pad(((m%60)+60)%60);
const hm2min=s=>{const[h,m]=String(s||'0:0').split(':').map(Number);return h*60+(m||0)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return hojeISO(d)};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const VERSAO='0.3';
/* o arquivo é enviado aos celulares e aberto direto (sem servidor): se o navegador que abriu não guarda dados, o operador é avisado */
const GUARDA=(()=>{try{localStorage.setItem('mt.teste','1');localStorage.removeItem('mt.teste');return true}catch(e){return false}})();
const LS={get(k,d){try{const v=localStorage.getItem('mt.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mt.'+k,JSON.stringify(v))}catch(e){toast('Memória do celular cheia: exporte o histórico')}}};

/* ======== configuração (a mesma lógica da plataforma; dados fictícios até o cadastro inicial) ======== */
const CFG0={linha:'Linha Vacutainer',unidade:'mil',junta:45,   /* sobra final que junta à hora anterior (o quadro da linha: 21:00–22:45 = 98) */
 turnos:[{c:'T1',n:'1º Turno',i:'06:00',f:'14:30'},{c:'T2',n:'2º Turno',i:'14:30',f:'22:45'},{c:'T3',n:'3º Turno',i:'22:45',f:'06:00'}],
 cats:[{c:'360060',n:'13x100 5 ml SST (TESTE)',meta:56,gel:0.834},{c:'360051',n:'13x75 3,5 ml SST (TESTE)',meta:58,gel:0.62},{c:'360056',n:'13x75 4 ml EDTA K2 (TESTE)',meta:60,gel:0},{c:'360057',n:'13x75 4 ml EDTA K3 (TESTE)',meta:56,gel:0}],
 maqs:['Tray Loader','Tullip A','Tullip B','Gel dispensor','Metro','Evacuator','Cap Placer','Silica spray coater','Kallfass','Packout','Etiquetagem','Transporte de bandejas'],
 motivos:['Setup / troca','Falha mecânica','Falha elétrica','Qualidade','Falta de material','Limpeza','Ajuste de processo','Reunião / comunicado','Outro'],
 scrapGel:['Purga','Sobra no barril','Outros']};
/* configuração: a embutida vale quando é mais nova que a do aparelho (rev = data da geração/gravação) */
let CFG=(()=>{const l=LS.get('cfg',null);if(CFG_EMB&&(!l||(l.rev||0)<(CFG_EMB.rev||0))){const c=JSON.parse(JSON.stringify(CFG_EMB));LS.set('cfg',c);return c}return l||JSON.parse(JSON.stringify(CFG0))})();
function gerarApp(){const M='/'+'*CFG*'+'/',i=FONTE.indexOf(M),j=FONTE.indexOf(M,i+M.length);if(i<0||j<0)throw new Error('arquivo sem marcador de configuração');
 const c={...CFG,rev:Date.now()};return FONTE.slice(0,i+M.length)+JSON.stringify(c).replace(/</g,'\\u003c')+FONTE.slice(j)}
const cat=c=>CFG.cats.find(x=>x.c===c);
const turnoDe=c=>CFG.turnos.find(t=>t.c===c);

/* intervalos do turno: hora cheia; sobra final de até `junta` min vai para o intervalo anterior (como a plataforma) */
function intervalos(t){let a=hm2min(t.i),b=hm2min(t.f);if(b<=a)b+=1440;const L=[];let x=a;
 while(x<b){const prox=Math.min(b,(Math.floor(x/60)+1)*60);L.push([x,prox]);x=prox}
 if(L.length>1){const u=L[L.length-1];if(u[1]-u[0]<=CFG.junta&&u[1]-u[0]<60){L.pop();L[L.length-1][1]=u[1]}}
 return L.map(([a,b])=>({de:min2hm(a),ate:min2hm(b),min:b-a}))}
/* turno de agora (o 3º turno que cruza a meia-noite pertence ao dia em que começou) */
function turnoAgora(d=new Date()){const m=d.getHours()*60+d.getMinutes();for(const t of CFG.turnos){let a=hm2min(t.i),b=hm2min(t.f);
  if(b>a?(m>=a&&m<b):(m>=a||m<b))return{t:t.c,data:b<=a&&m<b?addDias(hojeISO(d),-1):hojeISO(d)}}return{t:CFG.turnos[0].c,data:hojeISO(d)}}

/* ============================ dados do aparelho ============================ */
let TURNOS=LS.get('turnos',[]);const salvarT=()=>LS.set('turnos',TURNOS);
/* 0.3 · o turno guarda a meta, o gel e o nome do catálogo do momento do lançamento (catSnap): mudar a configuração depois não
   altera turnos já lançados nem os relatórios refeitos deles. Turno antigo sem catSnap usa a configuração atual. */
const fotoCat=c=>c?{c:c.c,n:c.n,meta:c.meta,gel:c.gel}:null;
const catDo=T=>T.catSnap&&T.catSnap.c===T.cat?T.catSnap:cat(T.cat);
function novoTurno(tc,data){const t=turnoDe(tc),c=CFG.cats[0];return{id:uid(),data,turno:tc,operador:LS.get('operador',''),cat:c.c,catSnap:fotoCat(c),lote:'',op:'',
 slots:intervalos(t).map(s=>({...s,real:null,par:[]})),scrapModo:'total',scrapTotal:null,scrapMaq:{},gel:{aplicadoKg:null,itens:{}},foto:null,obs:'',fechado:false,criadoEm:new Date().toISOString()}}
const planoSlot=(T,s)=>{const c=catDo(T);return c?Math.round(c.meta*s.min/60):0};
function resumo(T){const c=catDo(T)||{},pl=T.slots.reduce((a,s)=>a+planoSlot(T,s),0),inf=T.slots.filter(s=>s.real!=null),re=inf.reduce((a,s)=>a+(+s.real||0),0);
 const par=T.slots.flatMap(s=>s.par.map(p=>({...p,de:s.de,ate:s.ate}))),pm=par.reduce((a,p)=>a+(+p.min||0),0);
 const scrap=T.scrapModo==='maq'?Object.values(T.scrapMaq).reduce((a,v)=>a+(+v||0),0):(T.scrapTotal==null?null:+T.scrapTotal);
 const gT=c.gel?re*1000*c.gel/1000:null /* re (mil tubos) × 1000 × g/tubo ÷ 1000 = kg */, gR=T.gel.aplicadoKg==null?null:+T.gel.aplicadoKg, gS=Object.values(T.gel.itens||{}).reduce((a,v)=>a+(+v||0),0);
 const mot={};for(const p of par)mot[p.mot]=(mot[p.mot]||0)+(+p.min||0);
 return{pl,re,ader:pl?re/pl:null,falta:T.slots.length-inf.length,par,pm,mot:Object.entries(mot).sort((a,b)=>b[1]-a[1]),scrap,scrapPct:scrap!=null&&re?scrap/(re*1000+scrap):null,gT,gR,gS,gIdx:gT&&gR!=null?gR/gT:null,c}}
const corAder=a=>a==null?'muted':a>=1?'okc':a>=.9?'warnc':'critc';

/* fotos no IndexedDB (não enchem o localStorage) */
const FotoDB={db:null,async abrir(){if(this.db)return this.db;return this.db=await new Promise((ok,ko)=>{const r=indexedDB.open('meuturno',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})},
 async por(id,blob){const d=await this.abrir();return new Promise(ok=>{const t=d.transaction('fotos','readwrite');t.objectStore('fotos').put(blob,id);t.oncomplete=()=>ok()})},
 async ler(id){const d=await this.abrir();return new Promise(ok=>{const q=d.transaction('fotos').objectStore('fotos').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}};
function reduzir(file,max=1600){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
 c.toBlob(b=>b&&b.type==='image/webp'?ok(b):c.toBlob(ok,'image/jpeg',.82),'image/webp',.8)};im.onerror=()=>ko(new Error('não é imagem'));im.src=u})}

/* ============================ navegação ============================ */
const ROTAS=[['inicio','Início','⌂'],['turno','Meu turno','✎'],['historico','Histórico','☰'],['gel','Gel na ordem','⚗']];
function ir(r){location.hash=r}
window.addEventListener('hashchange',render);
function tabs(rota){$('#tabs').innerHTML=ROTAS.map(([k,t,i])=>`<a href="#${k}" class="${rota.startsWith(k)?'on':''}"><i>${i}</i>${t}</a>`).join('');$('#tabs').hidden=rota==='turno'}
function render(){const h=(location.hash||'#inicio').slice(1),[rota,arg]=h.split('/');tabs(rota);const a=$('#app');
 a.innerHTML=rota==='turno'?vTurno():rota==='historico'?vHist():rota==='gel'?vGel():rota==='rel'?vRel(arg):rota==='config'?vCfg():vInicio();
 ({turno:ligTurno,historico:ligHist,gel:ligGel,rel:ligRel,config:ligCfg,inicio:ligInicio}[rota]||ligInicio)(arg);scrollTo(0,0)}
const topo=(t,sub,dir='')=>`<header class="top">${dir}<h1>${esc(t)}${sub?`<div class="sub">${esc(sub)}</div>`:''}</h1><button class="ib" id="tema" aria-label="Tema">◐</button><a class="ib" href="#config" aria-label="Configuração" style="text-decoration:none">⚙</a></header>`;

/* ============================ início ============================ */
function abertoHoje(){const a=turnoAgora();return TURNOS.find(x=>!x.fechado&&x.data===a.data&&x.turno===a.t)}

 const r=ab?resumo(ab):null;
 return topo(CFG.linha,'Meu Turno · '+br(hojeISO()))+`<main><section class="hero">
  <button class="big" id="lancar"><span>${esc(t.n)} · ${t.i}–${t.f} · ${br(a.data)}</span><b>${ab?'Continuar meu turno':'Lançar meu turno'}</b><span>${ab?`${nf(r.re)} ${CFG.unidade} de ${nf(r.pl)} · ${ab.slots.filter(s=>s.real!=null).length} de ${ab.slots.length} horas lançadas`:'Hora a hora, paradas, scrap, gel e foto do quadro'}</span></button>

 <div><b>${br(T.data)} · ${esc(t.n)}</b><div class="small muted">${esc(T.cat)} · lote ${esc(T.lote||'—')} · ${esc(T.operador||'—')}</div></div>
 <div style="text-align:right"><b class="tn ${corAder(r.ader)}">${r.ader==null?'—':nf(r.ader*100)+'%'}</b><div class="small muted tn">${nf(r.re)} / ${nf(r.pl)}</div></div></button>`}
function ligInicio(){$('#lancar').onclick=()=>{const a=turnoAgora();if(!abertoHoje()){TURNOS.push(novoTurno(a.t,a.data));salvarT()}ir('turno')};$('#hist').onclick=()=>ir('historico');$('#gel').onclick=()=>ir('gel');comum()}
function comum(){const t=$('#tema');if(t)t.onclick=()=>{const c=document.documentElement.dataset.tema==='claro'?'':'claro';document.documentElement.dataset.tema=c;LS.set('tema',c)};$$('[data-rel]').forEach(b=>b.onclick=()=>ir('rel/'+b.dataset.rel))}

/* ============================ meu turno ============================ */
const atual=()=>abertoHoje()||TURNOS.filter(x=>!x.fechado).slice(-1)[0];
function slotAgora(T){const a=turnoAgora();if(a.data!==T.data||a.t!==T.turno)return -1;const d=new Date(),m=d.getHours()*60+d.getMinutes();
 return T.slots.findIndex(s=>{let x=hm2min(s.de),y=hm2min(s.ate);if(y<=x)y+=1440;let mm=m;if(mm<x)mm+=1440;return mm>=x&&mm<y})}
function vTurno(){const T=atual();if(!T)return topo('Meu turno')+`<main><div class="card">Nenhum turno aberto. <button class="btn pri blk" onclick="ir('inicio')">Voltar</button></div></main>`;
 const c=catDo(T)||{},r=resumo(T),ag=slotAgora(T);let acP=0,acR=0;
 return topo('Meu turno',`${(turnoDe(T.turno)||{}).n} · ${br(T.data)}`,'<a class="ib" href="#inicio" aria-label="Voltar" style="text-decoration:none">‹</a>')+`<main>
 <div class="card"><h2>Turno</h2><div style="display:grid;gap:10px">
  <div class="chips" role="radiogroup" aria-label="Turno">${CFG.turnos.map(t=>`<button class="chip${T.turno===t.c?' on':''}" data-tc="${t.c}">${esc(t.n)}</button>`).join('')}</div>
  <label class="f">Operador<input class="in" id="op" value="${esc(T.operador)}" placeholder="Seu nome" autocomplete="name"></label>
  <label class="f">Catálogo<select class="in" id="cat">${CFG.cats.map(x=>`<option value="${esc(x.c)}"${x.c===T.cat?' selected':''}>${esc(x.c+' · '+x.n)}</option>`).join('')}</select></label>
  <div class="g2"><label class="f">Lote<input class="in" id="lote" inputmode="numeric" value="${esc(T.lote)}" placeholder="Ex.: 6275187"></label><label class="f">Ordem (OP)<input class="in" id="opn" inputmode="numeric" value="${esc(T.op)}" placeholder="opcional"></label></div>
  <div class="small muted">Meta ${nf(c.meta)} ${CFG.unidade}/h${c.gel?` · gel ${nf(c.gel,3)} g/tubo`:''}</div></div></div>
 <div class="card"><h2>Hora a hora <span class="sp"></span><span class="small" style="text-transform:none;letter-spacing:0">${CFG.unidade} tubos</span></h2><div style="display:grid;gap:10px">
  ${T.slots.map((s,i)=>{const p=planoSlot(T,s);acP+=p;if(s.real!=null)acR+=+s.real;const pm=s.par.reduce((a,x)=>a+(+x.min||0),0);
   return`<div class="slot${i===ag?' agora':''}" data-i="${i}"><div class="h"><b class="tn">${s.de}–${s.ate}</b>${i===ag?'<span class="pill" style="color:var(--ac)">agora</span>':''}<span class="pl tn">plano ${nf(p)}</span></div>
   <div class="r"><input class="in tn" data-real="${i}" inputmode="numeric" pattern="[0-9]*" placeholder="produzido" value="${s.real??''}" aria-label="Produzido ${s.de} a ${s.ate}">
    <div class="acc tn">acumulado<br><b class="${s.real==null?'muted':corAder(acR/acP)}">${s.real==null?'—':nf(acR)}</b> / ${nf(acP)}</div></div>
   ${s.par.length?`<div class="pars">${s.par.map((x,k)=>`<div class="par"><span class="m tn">${x.min}'</span><span>${esc(x.mot)}${x.maq?' · '+esc(x.maq):''}${x.obs?`<span class="muted"> · ${esc(x.obs)}</span>`:''}</span><button class="x" data-delp="${i}:${k}" aria-label="Remover parada">×</button></div>`).join('')}</div>`:''}
   <button class="addp" data-addp="${i}">+ parada${pm?` (${pm} min)`:''}</button></div>`}).join('')}
 </div></div>
 <div class="card"><h2>Scrap de tubos</h2><div style="display:grid;gap:10px"><div class="seg"><button data-sm="total" class="${T.scrapModo==='total'?'on':''}">Total</button><button data-sm="maq" class="${T.scrapModo==='maq'?'on':''}">Por máquina</button></div>
  ${T.scrapModo==='total'?`<label class="f">Scrap total (tubos)<input class="in tn" id="scT" inputmode="numeric" value="${T.scrapTotal??''}" placeholder="0"></label>`
   :`<div style="display:grid;gap:8px">${CFG.maqs.map(m=>`<label class="f" style="grid-template-columns:1fr 120px;align-items:center">${esc(m)}<input class="in tn" data-scm="${esc(m)}" inputmode="numeric" value="${T.scrapMaq[m]??''}" placeholder="0" style="min-height:44px;font-size:16px;text-align:right"></label>`).join('')}</div>`}
  <div class="small muted">Total: <b class="tn">${r.scrap==null?'—':nf(r.scrap)}</b> tubos${r.scrapPct!=null?` · ${nf(r.scrapPct*100,2)}%`:''}</div></div></div>
 ${c.gel?`<div class="card"><h2>Gel <span class="sp"></span><span class="small" style="text-transform:none;letter-spacing:0">catálogo com gel</span></h2><div style="display:grid;gap:10px">

  <div class="kp"><div><small>Teórico (tubos × ${nf(c.gel,3)} g)</small><b class="tn">${nf(r.gT,1)} kg</b></div><div><small>Real ÷ teórico</small><b class="tn ${r.gIdx==null?'muted':r.gIdx<=1.02?'okc':r.gIdx<=1.05?'warnc':'critc'}">${r.gIdx==null?'—':nf(r.gIdx*100,1)+'%'}</b></div></div>
  <div class="small muted">Scrap de gel: <b>${nf(r.gS)} g</b></div></div></div>`:''}

  <div class="small muted">A foto vai junto no PDF e pode ir no WhatsApp. Ela não preenche os números sozinha.</div></div></div>

 <div style="height:70px"></div></main>
 <div class="bar"><div class="k"><span>Produzido / plano</span><b class="tn"><span class="${corAder(r.ader)}">${nf(r.re)}</span> / ${nf(r.pl)} ${CFG.unidade}</b><span class="tn">${r.ader==null?'':nf(r.ader*100)+'% · '}${r.pm} min parado</span></div><button class="btn ok" id="fechar">Fechar turno</button></div>`}
function ligTurno(){const T=atual();comum();if(!T)return;const sv=()=>{salvarT()},rr=()=>{salvarT();const y=scrollY;render();scrollTo(0,y)};
 $$('[data-tc]').forEach(b=>b.onclick=()=>{if(b.dataset.tc===T.turno)return;if(T.slots.some(s=>s.real!=null||s.par.length)&&!confirm('Trocar o turno refaz o hora a hora. Continuar?'))return;T.turno=b.dataset.tc;T.slots=intervalos(turnoDe(T.turno)).map(s=>({...s,real:null,par:[]}));rr()});
 $('#op').oninput=e=>{T.operador=e.target.value;LS.set('operador',T.operador);sv()};$('#lote').oninput=e=>{T.lote=e.target.value.trim();sv()};$('#opn').oninput=e=>{T.op=e.target.value.trim();sv()};
 $('#cat').onchange=e=>{T.cat=e.target.value;T.catSnap=fotoCat(cat(T.cat));rr()};
 $$('[data-real]').forEach(i=>{i.onchange=()=>{const v=i.value.trim();T.slots[+i.dataset.real].real=v===''?null:Math.max(0,+v.replace(',','.'));rr()}});
 $$('[data-addp]').forEach(b=>b.onclick=()=>parada(T,+b.dataset.addp,rr));
 $$('[data-delp]').forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.delp.split(':').map(Number);T.slots[i].par.splice(k,1);rr()});
 $$('[data-sm]').forEach(b=>b.onclick=()=>{T.scrapModo=b.dataset.sm;rr()});
 const sT=$('#scT');if(sT)sT.onchange=()=>{T.scrapTotal=sT.value===''?null:+sT.value;rr()};$$('[data-scm]').forEach(i=>i.onchange=()=>{if(i.value==='')delete T.scrapMaq[i.dataset.scm];else T.scrapMaq[i.dataset.scm]=+i.value;rr()});
 const gA=$('#gA');if(gA)gA.onchange=()=>{T.gel.aplicadoKg=gA.value===''?null:+gA.value.replace(',','.');rr()};$$('[data-sg]').forEach(i=>i.onchange=()=>{T.gel.itens[i.dataset.sg]=i.value===''?null:+i.value.replace(',','.');rr()});
 $('#obs').oninput=e=>{T.obs=e.target.value;sv()};
 const f=$('#foto');f.onchange=async()=>{if(!f.files[0])return;try{const b=await reduzir(f.files[0]);const id='f'+T.id;await FotoDB.por(id,b);T.foto=id;rr();toast('Foto do quadro anexada')}catch(e){toast('Não consegui ler a foto')}};
 if(T.foto)FotoDB.ler(T.foto).then(b=>{const v=$('#fotoV');if(b&&v)v.src=URL.createObjectURL(b)});
 $('#fechar').onclick=()=>fecharTurno(T);
 const ag=$('.slot.agora');if(ag&&!sessionStorage.mtRolou){sessionStorage.mtRolou=1;setTimeout(()=>ag.scrollIntoView({block:'center'}),60)}}
function folha(html,lig){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};lig(m,()=>m.remove());return m}
function parada(T,i,rr){const s=T.slots[i];let mn=null;folha(`<h3>Parada · ${s.de}–${s.ate}</h3>
 <div class="f small muted" style="font-weight:600">Minutos parados</div><div class="chips">${[5,10,15,20,30,40,60].map(v=>`<button class="chip" data-mn="${v}">${v}'</button>`).join('')}</div>
 <input class="in tn" id="pmin" inputmode="numeric" placeholder="ou digite os minutos">
 <label class="f">Motivo<div class="chips" id="pmot">${CFG.motivos.map(m=>`<button class="chip" data-mot="${esc(m)}">${esc(m)}</button>`).join('')}</div></label>
 <label class="f">Máquina<select class="in" id="pmaq"><option value="">— linha toda / não sei —</option>${CFG.maqs.map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
 <label class="f">O que aconteceu (curto)<input class="in" id="pobs" maxlength="80" placeholder="Ex.: sensor do cap 02"></label>
 <button class="btn pri blk" id="pok">Adicionar parada</button>`,(m,fim)=>{let mot='';
  $$('[data-mn]',m).forEach(b=>b.onclick=()=>{$$('[data-mn]',m).forEach(x=>x.classList.toggle('on',x===b));$('#pmin',m).value=b.dataset.mn});
  $$('[data-mot]',m).forEach(b=>b.onclick=()=>{mot=b.dataset.mot;$$('[data-mot]',m).forEach(x=>x.classList.toggle('on',x===b))});
  $('#pok',m).onclick=()=>{const v=+$('#pmin',m).value;if(!(v>0))return toast('Informe os minutos');if(v>s.min)return toast(`O intervalo tem ${s.min} min`);if(!mot)return toast('Escolha o motivo');
   s.par.push({min:v,mot,maq:$('#pmaq',m).value,obs:$('#pobs',m).value.trim()});fim();rr()}})}
function fecharTurno(T){const r=resumo(T),vaz=T.slots.filter(s=>s.real==null);const av=[];
 if(!T.operador)av.push('Informe o operador.');if(!T.lote)av.push('Informe o lote.');
 folha(`<h3>Fechar o turno</h3><div class="kp"><div><small>Produzido</small><b class="tn ${corAder(r.ader)}">${nf(r.re)} ${CFG.unidade}</b></div><div><small>Plano</small><b class="tn">${nf(r.pl)} ${CFG.unidade}</b></div><div><small>Aderência</small><b class="tn ${corAder(r.ader)}">${r.ader==null?'—':nf(r.ader*100)+'%'}</b></div><div><small>Paradas</small><b class="tn">${r.pm} min</b></div></div>
  ${vaz.length?`<div class="warnbox">${vaz.length} hora(s) sem produção informada: ${vaz.map(s=>s.de).join(', ')}. Elas vão como "não informado", não como zero.</div>`:''}
  ${av.length?`<div class="warnbox">${av.join(' ')}</div>`:''}
  <button class="btn ok blk" id="fok"${av.length?' disabled style="opacity:.5"':''}>Fechar e gerar relatório</button><button class="btn blk" id="fno">Continuar lançando</button>`,(m,fim)=>{
  $('#fno',m).onclick=fim;$('#fok',m).onclick=()=>{T.fechado=true;T.fechadoEm=new Date().toISOString();salvarT();fim();toast('Turno fechado');ir('rel/'+T.id)}})}

function txtWA(T){const r=resumo(T),t=turnoDe(T.turno)||{n:T.turno},c=r.c,u=CFG.unidade,ic=r.ader==null?'⚪':r.ader>=1?'🟢':r.ader>=.9?'🟡':'🔴';
 const L=[`*${CFG.linha} · ${t.n} · ${br(T.data)}*`,`Operador: ${T.operador||'—'}`,`Catálogo ${T.cat}${c&&c.n?' ('+c.n+')':''} · Lote ${T.lote||'—'}${T.op?' · OP '+T.op:''}`,'',
  `${ic} *Produção: ${nf(r.re)} de ${nf(r.pl)} ${u}* (${r.ader==null?'—':nf(r.ader*100)+'%'})`,`⏱ Paradas: *${r.pm} min*${r.mot.length?' · '+r.mot.slice(0,3).map(([m,v])=>`${m} ${v}'`).join(', '):''}`,
  `🗑 Scrap: ${r.scrap==null?'não informado':nf(r.scrap)+' tubos'+(r.scrapPct!=null?` (${nf(r.scrapPct*100,2)}%)`:'')}`];
 if(T.scrapModo==='maq'){const M=Object.entries(T.scrapMaq).filter(([,v])=>+v>0).sort((a,b)=>b[1]-a[1]);if(M.length)L.push('   '+M.map(([m,v])=>`${m} ${nf(v)}`).join(' · '))}
 if(c&&c.gel)L.push(`🧪 Gel: real ${r.gR==null?'—':nf(r.gR,1)+' kg'} · teórico ${nf(r.gT,1)} kg${r.gIdx!=null?` (${nf(r.gIdx*100,1)}%)`:''} · scrap ${nf(r.gS)} g`);
 L.push('','*Hora a hora* (real/plano)');let aP=0,aR=0;for(const s of T.slots){const p=planoSlot(T,s);aP+=p;aR+=+s.real||0;const pm=s.par.reduce((a,x)=>a+x.min,0);
  L.push(`${s.de}  ${s.real==null?'—':nf(s.real)}/${nf(p)}${pm?`  ⏱${pm}' ${s.par.map(x=>x.mot+(x.obs?' – '+x.obs:'')).join('; ')}`:''}`)}
 if(T.obs)L.push('',`📝 ${T.obs}`);return L.join('\n')}

 return topo('Relatório do turno',`${t.n} · ${br(T.data)}`,'<a class="ib" href="#historico" aria-label="Voltar" style="text-decoration:none">‹</a>')+`<main>

async function cartao(T,cv){const r=resumo(T),t=turnoDe(T.turno)||{n:T.turno},x=cv.getContext('2d'),W=1080,F='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif';

 x.fillStyle='#93a1ad';x.font=`500 30px ${F}`;x.fillText(`Lote ${T.lote||'—'}${T.op?' · OP '+T.op:''} · ${T.operador||'—'}`,60,210);
 const cor=r.ader==null?'#93a1ad':r.ader>=1?'#3fb27f':r.ader>=.9?'#e0a43a':'#e5534b';

 tile(60,260,465,'PRODUZIDO ('+CFG.unidade.toUpperCase()+')',nf(r.re),cor);tile(555,260,465,'PLANO',nf(r.pl));tile(60,455,465,'ADERÊNCIA',r.ader==null?'—':nf(r.ader*100)+'%',cor);tile(555,455,465,'PARADAS',r.pm+' min',r.pm?'#e0a43a':'#e8edf1');
 /* hora a hora: barras plano × real */

 $('#cim').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.cfg||!Array.isArray(j.cfg.turnos))throw 0;CFG={...j.cfg,rev:Date.now()};LS.set('cfg',CFG);toast('Configuração recebida');render()}catch(er){toast('Arquivo de configuração inválido')}}}

/* ============================ partida ============================ */
document.documentElement.dataset.tema=LS.get('tema','');
render();
</script>
</body>
</html>
